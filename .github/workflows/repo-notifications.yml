name: Repository Notifications

# Issue titles, commit messages, author names and branch names are written by
# whoever opened the issue, wrote the commit or named the branch. They reach the
# shell only through `env:` and are read as "$VAR". Do not put `${{ ... }}`
# inside a `run:` block in this file: GitHub pastes the value into the script
# before bash reads it, so the text would run as commands.
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections

# Neither job reads the repository or calls the GitHub API.
permissions: {}

on:
  push:
    branches:
      - main
      - develop
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  create:
  delete:

jobs:
  init:
    # Dependabot's events get no repo secrets, and its weekly branches need no notice.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      event_type: ${{ steps.set_info.outputs.event_type }}
      event_title: ${{ steps.set_info.outputs.event_title }}
      event_description: ${{ steps.set_info.outputs.event_description }}
      event_url: ${{ steps.set_info.outputs.event_url }}
      event_author: ${{ steps.set_info.outputs.event_author }}
      should_notify: ${{ steps.set_info.outputs.should_notify }}
    steps:
      - name: Determine event information
        id: set_info
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_STATE: ${{ github.event.issue.state }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_HTML_URL: ${{ github.event.comment.html_url }}
          REF_TYPE: ${{ github.event.ref_type }}
          REF: ${{ github.event.ref }}
        run: |
          # Every output uses a random delimiter, so a value that contains a
          # line such as "EOF" cannot end early and set the other outputs.
          set_output() {
            local delimiter
            delimiter="EOF_$(openssl rand -hex 16)"
            {
              printf '%s<<%s\n' "$1" "$delimiter"
              printf '%s\n' "$2"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          case "$EVENT_NAME" in
            push)
              COMMIT_COUNT="1"
              [[ -z "$COMMIT_AUTHOR" ]] && COMMIT_AUTHOR="$ACTOR"
              [[ -z "$COMMIT_MESSAGE" ]] && COMMIT_MESSAGE="No commit message"
              [[ -z "$COMMIT_URL" ]] && COMMIT_URL="$REPO_URL/commit/$SHA"
              set_output event_type "push"
              set_output event_title "New commits pushed to $REF_NAME"
              set_output event_description "$(printf '\n• **Commits:** %s\n\n• **Author:** %s\n\n• **Message:** %s\n' \
                "$COMMIT_COUNT" "$COMMIT_AUTHOR" "$COMMIT_MESSAGE")"
              set_output event_url "$COMMIT_URL"
              set_output event_author "$ACTOR"
              set_output should_notify "true"
              printf 'Push event detected on %s\n' "$REF_NAME"
              ;;
            issues)
              set_output event_type "issue"
              set_output event_title "Issue $EVENT_ACTION: $ISSUE_TITLE"
              set_output event_description "$(printf '\n• **Issue #%s** by @%s\n\n• **Action:** %s\n\n• **State:** %s\n' \
                "$ISSUE_NUMBER" "$ISSUE_AUTHOR" "$EVENT_ACTION" "$ISSUE_STATE")"
              set_output event_url "$ISSUE_URL"
              set_output event_author "$ISSUE_AUTHOR"
              set_output should_notify "true"
              printf 'Issue event detected: %s\n' "$EVENT_ACTION"
              ;;
            issue_comment)
              set_output event_type "issue_comment"
              set_output event_title "New comment on Issue #$ISSUE_NUMBER"
              set_output event_description "$(printf '\n• **Issue:** %s\n\n• **Comment by:** @%s\n' \
                "$ISSUE_TITLE" "$COMMENTER")"
              set_output event_url "$COMMENT_HTML_URL"
              set_output event_author "$COMMENTER"
              set_output should_notify "true"
              echo "Issue comment event detected"
              ;;
            create | delete)
              if [[ "$EVENT_NAME" == "create" ]]; then
                verb="created"
                url="$REPO_URL/tree/$REF"
              else
                verb="deleted"
                url="$REPO_URL"
              fi
              set_output event_type "$EVENT_NAME"
              set_output event_title "$REF_TYPE $verb: $REF"
              set_output event_description "$(printf '\n• **Type:** %s\n\n• **Name:** %s\n' "$REF_TYPE" "$REF")"
              set_output event_url "$url"
              set_output event_author "$ACTOR"
              set_output should_notify "true"
              printf '%s event detected: %s\n' "${EVENT_NAME^}" "$REF_TYPE"
              ;;
            *)
              set_output should_notify "false"
              echo "No notification needed for this event"
              ;;
          esac

  notify:
    needs: init
    if: needs.init.outputs.should_notify == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Display Repository Notification
        env:
          EVENT_TYPE: ${{ needs.init.outputs.event_type }}
          EVENT_TITLE: ${{ needs.init.outputs.event_title }}
          EVENT_AUTHOR: ${{ needs.init.outputs.event_author }}
          EVENT_URL: ${{ needs.init.outputs.event_url }}
          # Only whether the secret is set, not its value.
          HAS_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          echo "📢 Repository Event Notification"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          printf 'Type: %s\n' "$EVENT_TYPE"
          printf 'Title: %s\n' "$EVENT_TITLE"
          printf 'Author: %s\n' "$EVENT_AUTHOR"
          printf 'URL: %s\n' "$EVENT_URL"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Checking Discord webhook secret..."
          if [[ "$HAS_WEBHOOK" != "true" ]]; then
            echo "⚠️  WARNING: DISCORD_WEBHOOK_URL secret is not set!"
          else
            echo "✅ DISCORD_WEBHOOK_URL secret is set"
          fi

      # Values in `with:` are handed to the action as plain strings and are not
      # run by a shell, so the outputs can go here directly.
      - name: Notify Discord
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "${{ needs.init.outputs.event_title }}"
          description: "${{ needs.init.outputs.event_description }}"
          url: "${{ needs.init.outputs.event_url }}"
          color: 0x5865F2

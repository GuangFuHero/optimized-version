name: Backend Tests

on:
  # No path filter on pull_request or merge_group: the `changes` job decides (see below), so the
  # `pytest` check reports on every PR and in the merge queue and can be a required check.
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

# A new push to a PR cancels its run still going. Each commit on main gets a group of its own, so
# every run there finishes: a shared group holds only one waiting run, and a newer push cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the real job runs. The workflow itself always starts, so the check named below
  # always reports: a required check whose workflow never started would leave a PR waiting forever.
  # Pull requests run it only when they touch the paths below; the merge queue and main always run it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" | grep -qE '^(Backend/|\.github/workflows/backend-tests\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  pytest:
    needs: changes
    # Skipped when the PR does not touch Backend/; a skipped job counts as passing.
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # PostGIS with h3-pg, the image docker-compose.yml builds: the migrations install h3 and h3_postgis.
      # A service container cannot be built from a Dockerfile, so it is built and started here.
      - uses: docker/setup-buildx-action@v3
      - name: Build Postgres image
        uses: docker/build-push-action@v6
        with:
          context: Backend/docker/postgres-h3
          load: true
          tags: disaster-postgres-h3:ci
          cache-from: type=gha,scope=postgres-h3
          cache-to: type=gha,mode=max,scope=postgres-h3
      # Thrown away after the job, and the suite builds its databases afresh each run: no need to
      # survive a crash. The image's entrypoint hands the -c flags to postgres.
      - name: Start Postgres
        run: >-
          docker run -d --name postgres -p 5432:5432
          -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres
          disaster-postgres-h3:ci -c fsync=off -c synchronous_commit=off -c full_page_writes=off

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: Backend/pyproject.toml
      - name: Install dependencies
        working-directory: Backend
        run: uv sync

      # Over TCP: while the image runs its init scripts, Postgres listens on the socket alone.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do
            if docker exec postgres pg_isready -h 127.0.0.1 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgres
          exit 1

      # conftest.py gives each xdist worker its own database and Redis db (15, 14, 13, 12). The
      # user must be a superuser: the suite installs an event trigger and resets in replica mode.
      - name: Run tests
        working-directory: Backend
        env:
          ENV: testing
          PYTHONPATH: .
          TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/disaster_rescue_test
          TEST_ADMIN_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          TEST_REDIS_URL: redis://localhost:6379/15
        run: uv run --no-sync python -m pytest tests -q -n 4

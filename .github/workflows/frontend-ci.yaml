name: Frontend CI

on:
  # No path filter on pull_request or merge_group: the `changes` job decides (see below), so the
  # `checks` check reports on every PR and in the merge queue and can be a required check.
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - "Backend/**"
      - ".github/workflows/frontend-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether the real job runs. The workflow itself always starts, so the check named below
  # always reports: a required check whose workflow never started would leave a PR waiting forever.
  # Pull requests run it only when they touch the paths below; the merge queue and main always run it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...$HEAD" | grep -qE '^(Frontend/|Backend/|\.github/workflows/frontend-ci\.yaml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    # Skipped when the PR touches neither Frontend/ nor Backend/; a skipped job counts as passing.
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: Frontend/package.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm schemas:generate
      - run: git diff --exit-code
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

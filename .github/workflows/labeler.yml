name: Label PRs by path

# pull_request_target 才有權限替 fork 來的 PR 加標籤。這個 workflow 不 checkout PR 的程式碼，
# 也不執行它，只讀改到的檔名，所以不會跑到外部送進來的程式。
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false

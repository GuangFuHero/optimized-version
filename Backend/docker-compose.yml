# Development-only local stack.
# For staging deployment (backend + frontend + Cloudflare tunnel), use
# ./scripts/deploy.sh with docker-compose.staging.yml — never `docker compose up` directly.
services:
  db:
    # PostGIS + h3-pg (ADR-283). After pulling this change once:
    #   docker compose up -d --build db
    build: ./docker/postgres-h3
    image: disaster-postgres-h3:16-3.4
    platform: linux/amd64
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./.db:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    # Matches docker-compose.staging.yml, and for the same reason (ADR-192). Since feature
    # 014 `session:{sid}` is read on EVERY authenticated request, not just on /auth/refresh:
    # an evicted or lost session key is now an immediate sign-out. Under allkeys-lru with no
    # volume, memory pressure silently signs users out (measured: the session key IS evicted),
    # and a crash or a container rebuild takes every session with it — and because the
    # fail-closed 401 is deliberately identical to an invalid token, those are
    # indistinguishable from a real revocation.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      # Bind mount, matching the db service above rather than introducing a named volume.
      - ./.redis:/data
    ports:
      - "6379:6379"
    networks:
      - app-network

  backend:
    build: .
    # Dev only: override the image CMD to enable hot-reload (code is bind-mounted below).
    # Prod uses the Dockerfile CMD (no --reload).
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - SQLALCHEMY_DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/postgres
      - SECRET_KEY=your-secret-key-for-local-dev
      - REDIS_URL=redis://redis:6379
      - ENV=development
      # Served over plain http here, where a browser drops a Secure cookie. The other sign-in settings
      # default to this machine's values (ADR-326).
      - AUTH_COOKIE_SECURE=false
    depends_on:
      - db
      - redis
    networks:
      - app-network

  frontend:
    build:
      context: ../Frontend
    # The site holds no sign-in secret: the backend signs browsers in (Frontend/docs/authentication.md).
    environment:
      API_BASE_URL: http://backend:8000/api
      GRAPHQL_URL: http://backend:8000/graphql
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

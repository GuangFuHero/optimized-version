  /* 各頁都有這條重設；漏了的話設計系統的 Chip 會吃到瀏覽器預設的 2px outset 外框，看起來像 3D 按鍵 */
  button { border: 0; font-family: inherit; }
  html, body { margin: 0; background: var(--color-bg-neutral-subtle); color: var(--color-fg-neutral-default); font: var(--font-body-400); }
  .page { max-width: 1080px; margin: 0 auto; padding: 32px 16px 80px; }
  h1 { font: var(--font-heading-800); margin: 0 0 4px; }

  h3 { font: var(--font-label-500); margin: 24px 0 8px; }
  .sub { color: var(--color-fg-neutral-subtle); margin: 0 0 16px; }
  .card { background: var(--color-bg-neutral-default); border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--color-border-default); padding: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .grid { display: grid; grid-template-columns: 92px repeat(6, 1fr); gap: 14px 12px; align-items: center; }
  .grid .h { font: var(--font-label-300); font-weight: 700; color: var(--color-fg-neutral-subtle); }
  .cap { font: var(--font-label-300); color: var(--color-fg-neutral-subtle); margin-top: 6px; }
  table { border-collapse: collapse; width: 100%; font: var(--font-label-400); font-weight: 400; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--color-border-default); vertical-align: middle; }
  th { font-weight: 700; color: var(--color-fg-neutral-subtle); }
  code { font-family: var(--font-data); background: var(--color-bg-neutral-sunken); padding: 1px 5px; border-radius: var(--radius-sm); font-size: 0.85em; }
  .sw { display: inline-block; width: 64px; height: 28px; background: var(--color-bg-primary-subtle); box-shadow: inset 0 0 0 1.5px var(--color-border-accent); vertical-align: middle; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .ok, .no { font: var(--font-label-300); font-weight: 700; padding: 2px 8px; border-radius: var(--radius-full); display: inline-block; margin-bottom: 10px; }
  .ok { background: var(--color-bg-success-subtle, #e3f5e8); color: var(--color-fg-success, #166534); }
  .no { background: var(--color-bg-danger-subtle); color: var(--color-fg-danger); }

  .seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--color-bg-neutral-sunken); border-radius: var(--radius-full); }
  @media (max-width: 760px) {
    .grid { min-width: 700px; }
    .two { grid-template-columns: 1fr; }
    .scroll { overflow-x: auto; }
  }
</style>

<script>
window.WGIcon = function WGIcon({ n, s = 18, c = "currentColor" }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !window.lucide || !lucide[n]) return;
    const el = lucide.createElement(lucide[n]);
    el.setAttribute('width', s); el.setAttribute('height', s); el.setAttribute('stroke', c); el.setAttribute('stroke-width', '2');
    ref.current.innerHTML = ''; ref.current.appendChild(el);
  }, [n, s, c]);
  return React.createElement('span', { ref, style: { display: 'inline-flex', lineHeight: 0 } });
};
</script>

const I = (n) => <WGIcon n={n} />;

// 現況：照抄 station-table.jsx 的 btnCss 與 wg-bulk.jsx 的 WGNewSplitButton，給對照用
const OLD_BTN = { display: "inline-flex", alignItems: "center", gap: 6, height: 42, padding: "0 14px", borderRadius: "var(--radius-md)", border: "1px solid var(--color-border-default)", background: "var(--color-bg-neutral-default)", cursor: "pointer", font: "var(--font-label-300)", color: "var(--color-fg-neutral-default)" };

      <WGButton variant="neutral" startIcon={I("Download")}>匯出</WGButton>
      <WGSplitButton label="新增站點" icon={I("Plus")} items={[{ label: "新增一個" }, { label: "從 CSV／Excel 匯入多個" }]} />

const VN = { primary: "主要", secondary: "次要（藍）", outline: "外框", neutral: "工具（新增）", ghost: "文字", danger: "危險" };

function Section({ id, title, sub, children }) {

      <Section id="radius" title="1. 圓角規則" sub="按鈕是膠囊；欄位是方圓。形狀本身是提示：膠囊＝按下去會做事，方圓＝這裡可以打字。">

            <span /> {["預設", "hover", "鍵盤焦點", "載入中", "停用"].map(t => <span key={t} className="h">{t}</span>)}

          <WGButton block size="lg">請求協助</WGButton>

          <span className="ok">❌ 不採用：提示浮在搜尋框正下方（會壓到下一列上緣）</span>
          <div className="row" style={{ flexWrap: "nowrap", minWidth: 940, marginTop: 8, marginBottom: 22 }}>
            <WGButton variant="neutral" startIcon={I("SlidersHorizontal")} endIcon={I("ChevronDown")}>篩選</WGButton>
            <div style={{ position: "relative" }}>
              <WGSearch icon={I("Search")} defaultValue="大" style={{ width: 260 }} />
              <span style={{ position: "absolute", left: 16, top: "calc(100% + 4px)", whiteSpace: "nowrap", font: "var(--font-label-300)", color: "var(--color-fg-neutral-muted)" }}>再打一個字就開始搜尋</span>
            </div>
            <span style={{ marginLeft: "auto" }} />
            <WGButton variant="neutral" startIcon={I("Download")}>匯出</WGButton>
            <WGSplitButton label="新增任務" icon={I("Plus")} items={[{ label: "新增一張" }, { label: "從 CSV／Excel 匯入多張" }]} />
          </div>
          <p className="cap">工具列高度不變、按鈕不動；提示壓在下面那一列（表格或統計格）的上緣空白裡。</p>
        </div>
        <div className="card scroll">
          <span className="ok">✅ 採用（INP-104）：不另外出提示，規則寫在框裡</span>
          <div className="row" style={{ flexWrap: "nowrap", minWidth: 940, marginTop: 8 }}>
            <WGButton variant="neutral" startIcon={I("SlidersHorizontal")} endIcon={I("ChevronDown")}>篩選</WGButton>
            <WGSearch icon={I("Search")} placeholder="打 2 個字以上搜尋標題、地址…" style={{ width: 260 }} />
            <span style={{ marginLeft: "auto" }} />
            <WGButton variant="neutral" startIcon={I("Download")}>匯出</WGButton>
            <WGSplitButton label="新增任務" icon={I("Plus")} items={[{ label: "新增一張" }, { label: "從 CSV／Excel 匯入多張" }]} />
          </div>
          <p className="cap">最簡單；缺點是打了一個字之後，框裡的說明就不見了。</p>
        </div>

        <h3>B. 二選一（匯入時的「不建立／仍要建立」）</h3>
        <div className="two">
          <div className="card">
            <span className="ok" style={{ background: "var(--color-bg-neutral-subtle)", color: "var(--color-fg-neutral-subtle)" }}>❌ 不採用：BTN-107＋outline 的滑過</span>
            <div style={{ display: "grid", gridTemplateColumns: "80px 1fr", gap: "12px 12px", alignItems: "center", marginTop: 8 }}>
              <span className="cap" style={{ margin: 0 }}>都沒滑過</span>
              <div className="row"><WGButton variant="outline" size="sm" selected>不建立</WGButton><WGButton variant="outline" size="sm" selected={false}>仍要建立</WGButton></div>
              <span className="cap" style={{ margin: 0 }}>滑過右邊</span>
              <div className="row"><WGButton variant="outline" size="sm" selected>不建立</WGButton><WGButton variant="outline" size="sm" selected={false} className="is-hover">仍要建立</WGButton></div>
            </div>
            <p className="cap">滑過沒選的那顆，底色跟選中的一樣，還上浮 2px —— 一時分不出哪個才是選中的。</p>
          </div>
          <div className="card">
            <span className="ok">✅ 採用（BTN-107b）：滑過用灰底、不上浮；選中多一個打勾</span>
            <div style={{ display: "grid", gridTemplateColumns: "80px 1fr", gap: "12px 12px", alignItems: "center", marginTop: 8 }}>
              <span className="cap" style={{ margin: 0 }}>都沒滑過</span>
              <div className="row"><WGButton variant="outline" size="sm" selected startIcon={I("Check")}>不建立</WGButton><WGButton variant="outline" size="sm" selected={false} style={{ "--btn-border": "var(--color-border-default)", "--btn-fg": "var(--color-fg-neutral-default)" }}>仍要建立</WGButton></div>
              <span className="cap" style={{ margin: 0 }}>滑過右邊</span>
              <div className="row"><WGButton variant="outline" size="sm" selected startIcon={I("Check")}>不建立</WGButton><WGButton variant="outline" size="sm" selected={false} className="is-hover" style={{ "--btn-border": "var(--color-border-default)", "--btn-fg": "var(--color-fg-neutral-default)", "--btn-bg-hover": "var(--color-bg-neutral-subtle)", transform: "none" }}>仍要建立</WGButton></div>
            </div>
            <p className="cap">沒選的那顆是灰框黑字，滑過只變淡灰；選中的是淡橘底、橘框、橘字＋打勾，不只靠顏色。</p>
          </div>
        </div>
      </Section>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

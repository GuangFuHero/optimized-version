<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg-neutral-subtle); }
  #root { height: 100vh; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--color-bg-neutral-sunken); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }
  select { background-image: none; }
  .leaflet-container { font-family: inherit; }
  .st-leaflet-tip { border: 1px solid var(--color-border-default) !important; border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; padding: 9px 11px !important; background: var(--color-bg-neutral-default) !important; }
  .st-leaflet-tip::before { display: none !important; }
  /* 列表 hover／圖示按鈕／浮起動畫：與任務管理頁同一組（tk-* 前綴沿用） */
  /* 整列 hover 變底色，與任務管理頁同一組色 */
  .tk-row { transition: background var(--transition-fast); }
  .tk-row:hover { background: var(--color-bg-neutral-subtle); }
  .tk-iconbtn { border: none; background: transparent; cursor: pointer; line-height: 0; width: 32px; height: 32px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; transition: background var(--transition-fast); }
  .tk-iconbtn:hover { background: var(--color-bg-neutral-subtle); }
  @keyframes tkRise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .tk-rise { animation: tkRise var(--duration-base, 250ms) cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @keyframes wgDrawerIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes wgToastIn { from { transform: translate(-50%, 16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <rect x="26" y="62" width="32" height="9" rx="4.5" fill="#fff" opacity="0.6"/>
</svg>

<script>
// Shared helpers
window.WGMark = '';
window.WGIcon = function WGIcon({ n, s = 20, c = "currentColor", style }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !window.lucide || !lucide[n]) return;
    const el = lucide.createElement(lucide[n]);
    el.setAttribute('width', s); el.setAttribute('height', s);
    el.setAttribute('stroke', c); el.setAttribute('stroke-width', '2');
    ref.current.innerHTML = '';
    ref.current.appendChild(el);
  }, [n, s, c]);
  return React.createElement('span', { ref, style: { display: 'inline-flex', lineHeight: 0, ...style } });
};
</script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": [
    "#E3791E",
    "#C46416",
    "#FDF3E9"
  ],
  "density": "compact",
  "showStats": false
}/*EDITMODE-END*/;

function App() {
  const t = TWEAK_DEFAULTS;
  const [nav, setNav] = React.useState("station");
  // 角色視角走共用 store（wg-event.js），跨頁不會換人
  const [role, setRole] = window.useWGRole(window.TK_PERSONAS, "super");
  // 列表／地圖切換的狀態上提到這一層，因為切換鈕在共用 shell 的 header 裡
  const [view, setView] = React.useState("table");
  const [count, setCount] = React.useState(0);

  React.useEffect(() => {
    const r = document.documentElement;
    const [base, hover, subtle] = t.accent;
    r.style.setProperty('--color-bg-primary', base);
    r.style.setProperty('--color-bg-primary-hover', hover);
    r.style.setProperty('--color-bg-primary-subtle', subtle);
  }, [t.accent]);

  const { ConsoleShell, ResourceStation, StationRoleBar, WGViewSwitch } = window;
  const body = nav === "station"
    ? <ResourceStation tweaks={t} role={role} setRole={setRole} view={view} setView={setView} onCount={setCount} />
    : <Placeholder nav={nav} />;

  return (
    <React.Fragment>
      <window.WGPage roleBar={<StationRoleBar role={role} setRole={setRole} />}>
        <ConsoleShell active={nav} role={role}
          onNavigate={(id) => window.wgNavigate(id, "station")} onLogout={() => setNav("station")}
          headerExtra={nav === "station" ? <WGViewSwitch count={count} value={view} onChange={setView} options={[["table","列表視圖","List"],["map","地圖視圖","Map"]]} /> : null}>
          {body}
        </ConsoleShell>
      </window.WGPage>
    </React.Fragment>
  );
}

function Placeholder({ nav }) {
  const labels = { map: "地圖", task: "任務管理", log: "事件紀錄", user: "用戶管理", settings: "設定" };
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: 420, gap: 12, color: "var(--color-fg-neutral-muted)" }}>
      <window.WGIcon n="Hammer" s={40} c="var(--color-fg-neutral-muted)" />
      <div className="wg-h600" style={{ color: "var(--color-fg-neutral-subtle)" }}>{labels[nav] || nav} · 建置中</div>
      <div className="wg-caption">此頁屬其他模組，本範例聚焦「資源站點管理」。</div>
    </div>
  );
}

fetch('assets/logo/mark.svg')
  .then(r => r.text())
  .then(svg => {
    window.WGMark = svg
      .replace(/width="\d+"/, '').replace(/height="\d+"/, '')
      .replace(/<svg([^>]*)>/, '<svg$1 style="width:100%;height:100%" preserveAspectRatio="xMidYMid meet">');
  })
  .catch(() => {})
  .finally(() => {
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  });
</script>

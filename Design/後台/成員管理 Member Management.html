<link rel="stylesheet" href="_ds/wan-guard-design-system-9c8f68e7-f87a-466d-9430-b41c578b2001/styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg-neutral-subtle); }
  #root { height: 100vh; overflow: hidden; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--color-bg-neutral-sunken); border-radius: 999px; }

  .mm-iconbtn {
    border: none; background: transparent; cursor: pointer; line-height: 0;
    width: 32px; height: 32px; border-radius: var(--radius-full);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background var(--transition-fast);
  }
  .mm-iconbtn:hover { background: var(--color-bg-neutral-subtle); }

  .mm-row { transition: background var(--transition-fast); }
  .mm-row:hover { background: var(--color-bg-neutral-subtle); }

  @media (prefers-reduced-motion: no-preference) {
    .mm-rise { animation: mmRise var(--duration-base, 250ms) cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes mmRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/wan-guard-design-system-9c8f68e7-f87a-466d-9430-b41c578b2001/_ds_bundle.js"></script>

</head>
<body>
<div id="root"></div>

<script>
// 共用 Lucide icon helper（與 DS console kit 相同介面）
window.WGMark = '';
window.WGIcon = function WGIcon({ n, s = 20, c = "currentColor", style }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !window.lucide || !lucide[n]) return;
    const el = lucide.createElement(lucide[n]);
    el.setAttribute('width', s); el.setAttribute('height', s);
    el.setAttribute('stroke', c); el.setAttribute('stroke-width', '2');
    ref.current.innerHTML = '';
    ref.current.appendChild(el);
  }, [n, s, c]);
  return React.createElement('span', { ref, style: { display: 'inline-flex', lineHeight: 0, ...style } });
};
</script>

<script src="js/admin/shell/wg-terms.js"></script>

<script type="text/babel" data-presets="react">
// 載入品牌 mark 後渲染
fetch('assets/logo/mark.svg')
  .then((r) => r.text())
  .then((svg) => {
    window.WGMark = svg
      .replace(/width="\d+"/, '').replace(/height="\d+"/, '')
      .replace(/<svg([^>]*)>/, '<svg$1 style="width:100%;height:100%" preserveAspectRatio="xMidYMid meet">');
  })
  .catch(() => {})
  .finally(() => {
    ReactDOM.createRoot(document.getElementById('root')).render(<window.MMApp />);
  });
</script>

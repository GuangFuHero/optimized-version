<script type="text/babel" data-presets="react">
/* 前台的「找不到這一頁」（2026-10-18）。畫面本體在 js/shared/wg-notfound.jsx，前後台共用。
 * 正式版：前台路由對不到任何頁面時顯示這一頁（例：/mapp、舊的分享連結）。
 * 🔒 外殼照常顯示（側欄、頂欄、緊急公告、登入狀態），下一步只給前台三個入口。
 * ⚠️ 不處理「任務單或站點已被刪除」—— 那是地圖／列表裡的內容狀態，不是這一頁。 */
function SiteNotFoundPage() {
  const [session] = useSitePersona();
  const state = { dataType: 'station', subDataTypes: [] };
  const links = [
    { key: 'map',   label: '救災地圖',     sub: '看附近的任務與資源站點', icon: 'Map',        href: encodeURI('前台地圖 Site Map.html') },
    { key: 'list',  label: '救災列表',     sub: '找需要人手的任務',       icon: 'LayoutList', href: encodeURI('前台列表 Site List.html') },
    { key: 'brief', label: '志工行前資訊', sub: '出發前要準備什麼',       icon: 'BookOpen',   href: encodeURI('前台行前資訊 Site Briefing.html') },
  ];
  return (
    <SiteShell module="notfound" state={state} search=""
      onSearchChange={(value) => {
        /* 同 /brief：這一頁沒有東西可搜，帶去列表搜，不要讓輸入框看起來壞掉。 */
        const v = (value || '').trim();
        if (v) window.location.href = encodeURI('前台列表 Site List.html') + '#/list/station?search=' + encodeURIComponent(v);
      }}
      isAuthenticated={session.isAuthenticated} platformRole={session.platformRole} userName={session.userName}
      onSignIn={() => window.SiteAuth.goSignIn()}
      onSignOut={() => window.SiteAuth.signOutHere()}>
      <WGNotFound realm="site" lead="連結可能打錯了，或這個頁面已經不在了。可以從這裡繼續：" links={links} />
    </SiteShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteNotFoundPage />);
</script>

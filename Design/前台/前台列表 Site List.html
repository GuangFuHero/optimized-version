<script type="text/babel" data-presets="react">
/* /list — app route composition（對應 apps/demo/src/app/(site)/list/[[...segments]]/page.tsx）
 * 與 /map 共用同一份外殼與路由狀態，只換主畫面。 */
const { useState } = React;

function SiteListPage() {
  const route = useSiteRouteState('list');
  // 身份改由 useSitePersona 提供（site-shell.jsx），不再 hardcode ——
  // 三個 persona（建立者／志工／未登入訪客）的切換器在頂欄，兩支 HTML 共用同一份狀態。
  const [session] = useSitePersona();
  return (
    <SiteShell module="list" state={route.state} search={route.state.search}
      onSearchChange={(value) => route.replace({ ...route.state, search: value || undefined })}
      isAuthenticated={session.isAuthenticated} platformRole={session.platformRole} userName={session.userName}
      onSignIn={() => { /* 原型：登入由頂欄的身份切換器代表，見 SitePersonaSwitch */ }}
      onSignOut={() => { /* 同上 */ }}>
      <SiteListView session={session} route={route} />
    </SiteShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteListPage />);
</script>

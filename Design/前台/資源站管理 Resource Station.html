<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資源站管理 Resource Station · 光復超人 ManagerEnd</title>
<link rel="stylesheet" href="_ds/wan-guard-design-system-9c8f68e7-f87a-466d-9430-b41c578b2001/styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg-neutral-subtle); }
  #root { min-height: 100vh; }
  *, *::before, *::after { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--color-bg-neutral-sunken); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }
  select { background-image: none; }
  @keyframes wgDrawerIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes wgToastIn { from { transform: translate(-50%, 16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/wan-guard-design-system-9c8f68e7-f87a-466d-9430-b41c578b2001/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="20" fill="#E3791E"/>
  <rect x="26" y="30" width="48" height="9" rx="4.5" fill="#111"/>
  <rect x="26" y="46" width="48" height="9" rx="4.5" fill="#fff" opacity="0.85"/>
  <rect x="26" y="62" width="32" height="9" rx="4.5" fill="#fff" opacity="0.6"/>
</svg>
</template>

<script>
// Shared helpers
window.WGMark = '';
window.WGIcon = function WGIcon({ n, s = 20, c = "currentColor", style }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !window.lucide || !lucide[n]) return;
    const el = lucide.createElement(lucide[n]);
    el.setAttribute('width', s); el.setAttribute('height', s);
    el.setAttribute('stroke', c); el.setAttribute('stroke-width', '2');
    ref.current.innerHTML = '';
    ref.current.appendChild(el);
  }, [n, s, c]);
  return React.createElement('span', { ref, style: { display: 'inline-flex', lineHeight: 0, ...style } });
};
</script>

<script type="text/babel" src="js/shared/tweaks-panel.jsx" data-presets="react"></script>
<script src="js/admin/shell/nav.js"></script>
<script src="js/admin/shell/wg-event.js"></script>
<script type="text/babel" src="js/admin/shell/wg-profile.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/shell/wg-notify.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/shell/wg-shell.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/station/station-data.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/station/station-shared.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/shell/station-shell.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/station/station-table.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/station/station-review-queue.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/station/station-map.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/station/station-drawer.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/station/station-export-dialog.jsx" data-presets="react"></script>
<script type="text/babel" src="js/admin/station/station-app.jsx" data-presets="react"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": [
    "#E3791E",
    "#C46416",
    "#FDF3E9"
  ],
  "density": "compact",
  "showStats": true
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [nav, setNav] = React.useState("station");
  const [role, setRole] = React.useState("auditor");

  React.useEffect(() => {
    const r = document.documentElement;
    const [base, hover, subtle] = t.accent;
    r.style.setProperty('--color-bg-primary', base);
    r.style.setProperty('--color-bg-primary-hover', hover);
    r.style.setProperty('--color-bg-primary-subtle', subtle);
  }, [t.accent]);

  const { ConsoleShell, ResourceStation, StationRoleBar } = window;
  const body = nav === "station"
    ? <ResourceStation tweaks={t} role={role} setRole={setRole} />
    : <Placeholder nav={nav} />;

  return (
    <React.Fragment>
      <div style={{ display: "flex", flexDirection: "column", minHeight: "100vh" }}>
        <StationRoleBar role={role} setRole={setRole} />
        <ConsoleShell active={nav} onNavigate={(id) => window.wgNavigate(id, "station")} onLogout={() => setNav("station")}>
          {body}
        </ConsoleShell>
      </div>
      <TweaksPanel>
        <TweakSection label="外觀" />
        <TweakColor label="主色強調" value={t.accent}
          options={[["#E3791E","#C46416","#FDF3E9"],["#D9602A","#B94C1E","#FBEDE6"],["#E0A21C","#C2870F","#FCF5E2"],["#C2410C","#9A3412","#FBEAE1"]]}
          onChange={(v) => setTweak('accent', v)} />
        <TweakRadio label="表格密度" value={t.density} options={["compact","regular"]}
          onChange={(v) => setTweak('density', v)} />
        <TweakSection label="版本對照" />
        <a href="資源站點管理 Resource Station v2.html"
           style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: "var(--radius-md)",
                    background: "var(--color-bg-neutral-subtle)", boxShadow: "inset 0 0 0 1px var(--color-border-default)",
                    font: "var(--font-label-300)", color: "var(--color-fg-neutral-subtle)", textDecoration: "none" }}>
          <window.WGIcon n="ArrowRight" s={15} c="currentColor" />開啟改版後的 v2
        </a>
        <TweakSection label="版面" />
        <TweakToggle label="顯示 BI 統計列" value={t.showStats} onChange={(v) => setTweak('showStats', v)} />
      </TweaksPanel>
    </React.Fragment>
  );
}

function Placeholder({ nav }) {
  const labels = { map: "地圖", task: "任務管理", log: "事件紀錄", user: "用戶管理", settings: "設定" };
  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: 420, gap: 12, color: "var(--color-fg-neutral-muted)" }}>
      <window.WGIcon n="Hammer" s={40} c="var(--color-fg-neutral-muted)" />
      <div className="wg-h600" style={{ color: "var(--color-fg-neutral-subtle)" }}>{labels[nav] || nav} · 建置中</div>
      <div className="wg-caption">此頁屬其他模組，本範例聚焦「資源站管理」。</div>
    </div>
  );
}

fetch('assets/logo/mark.svg')
  .then(r => r.text())
  .then(svg => {
    window.WGMark = svg
      .replace(/width="\d+"/, '').replace(/height="\d+"/, '')
      .replace(/<svg([^>]*)>/, '<svg$1 style="width:100%;height:100%" preserveAspectRatio="xMidYMid meet">');
  })
  .catch(() => {})
  .finally(() => {
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  });
</script>
</body>
</html>

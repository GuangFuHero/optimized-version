<style>
  .leaflet-container { font-family: inherit; }
  .tk-leaflet-tip { border: 1px solid var(--color-border-default) !important; border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; padding: 9px 11px !important; background: var(--color-bg-neutral-default) !important; }
  .tk-leaflet-tip::before { display: none !important; }
  .tk-pinwrap:hover .tk-pin { transform: scale(1.18) !important; }</style>
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg-neutral-subtle); }
  #root { height: 100vh; overflow: hidden; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--color-bg-neutral-sunken); border-radius: 999px; }

  .tk-iconbtn { border: none; background: transparent; cursor: pointer; line-height: 0; width: 32px; height: 32px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; transition: background var(--transition-fast); }
  .tk-iconbtn:hover { background: var(--color-bg-neutral-subtle); }

  .tk-row { transition: background var(--transition-fast); }
  .tk-row:hover { background: var(--color-bg-neutral-subtle); }

  @media (prefers-reduced-motion: no-preference) {
    .tk-rise { animation: tkRise var(--duration-base, 250ms) cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes tkRise { from { transform: translateY(8px); } to { transform: translateY(0); } }
    .tk-slide { animation: tkSlide var(--duration-base, 250ms) cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes tkSlide { from { transform: translateX(40px); } to { transform: translateX(0); } }
    .tk-pulse { animation: tkPulse 1.6s ease-in-out infinite; }
    @keyframes tkPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .tk-chip-new { animation: tkSlide 250ms cubic-bezier(0.34, 1.56, 0.64, 1) both, tkChipFlash 0.5s ease-in-out 3; }
    @keyframes tkChipFlash { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(227,121,30,0); } 50% { opacity: 0.8; box-shadow: 0 0 0 3px rgba(227,121,30,0.28); } }
    .tk-pin { transition: transform var(--duration-fast) var(--ease-spring); }
    .tk-tip { animation: tkTip var(--duration-fast) var(--ease-out) both; }
    @keyframes tkTip { from { opacity: 0; transform: translate(-50%, -2px); } to { opacity: 1; transform: translate(-50%, -6px); } }
  }
  .tk-chipbtn { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: var(--radius-full); border: 1px solid var(--color-border-default); background: var(--color-bg-neutral-default); cursor: pointer; font: var(--font-data-300); font-weight: 700; color: var(--color-fg-neutral-subtle); transition: background var(--transition-fast), border-color var(--transition-fast); }
  .tk-chipbtn:hover { background: var(--color-bg-neutral-subtle); border-color: var(--color-border-accent); }
  .tk-chipx { width: 18px; height: 18px; flex-shrink: 0; margin: 0 -4px 0 1px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: var(--radius-full); background: transparent; color: var(--color-fg-neutral-muted); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 150ms var(--ease-out), background 150ms var(--ease-out); }
  .tk-tag:hover .tk-chipx, .tk-tag:focus-within .tk-chipx { opacity: 1; pointer-events: auto; }
  .tk-chipx:hover { background: var(--color-bg-danger-subtle); color: var(--color-fg-danger); }
</style>

<script>
window.WGMark = '';
window.WGIcon = function WGIcon({ n, s = 20, c = "currentColor", style }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !window.lucide || !lucide[n]) return;
    const el = lucide.createElement(lucide[n]);
    el.setAttribute('width', s); el.setAttribute('height', s);
    el.setAttribute('stroke', c); el.setAttribute('stroke-width', '2');
    ref.current.innerHTML = '';
    ref.current.appendChild(el);
  }, [n, s, c]);
  return React.createElement('span', { ref, style: { display: 'inline-flex', lineHeight: 0, ...style } });
};
</script>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公開救災地圖 Public Rescue Map · 島嶼守望 Wan Guard</title>
<link rel="stylesheet" href="_ds/wan-guard-design-system-9c8f68e7-f87a-466d-9430-b41c578b2001/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<style>
  #pubmap { background: #EAF2F8; }
  .leaflet-container { font-family: inherit; }
  html, body { margin: 0; height: 100%; background: var(--color-bg-neutral-subtle); }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--color-bg-neutral-sunken); border-radius: 999px; }

  .pm-iconbtn { border: none; background: transparent; cursor: pointer; line-height: 0; width: 32px; height: 32px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; transition: background var(--transition-fast); }
  .pm-iconbtn:hover { background: var(--color-bg-neutral-subtle); }

  @media (prefers-reduced-motion: no-preference) {
    .pm-rise { animation: pmRise var(--duration-base, 250ms) cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes pmRise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .pm-slide { animation: pmSlide var(--duration-base, 250ms) cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    @keyframes pmSlide { from { transform: translateX(40px); } to { transform: translateX(0); } }
    .pm-pulse { animation: pmPulse 1.6s ease-in-out infinite; }
    @keyframes pmPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/wan-guard-design-system-9c8f68e7-f87a-466d-9430-b41c578b2001/_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script>
window.WGMark = '';
window.WGIcon = function WGIcon({ n, s = 20, c = "currentColor", style }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !window.lucide || !lucide[n]) return;
    const el = lucide.createElement(lucide[n]);
    el.setAttribute('width', s); el.setAttribute('height', s);
    el.setAttribute('stroke', c); el.setAttribute('stroke-width', '2');
    ref.current.innerHTML = '';
    ref.current.appendChild(el);
  }, [n, s, c]);
  return React.createElement('span', { ref, style: { display: 'inline-flex', lineHeight: 0, ...style } });
};
</script>

<script src="js/public/pub-data.js"></script>
<script type="text/babel" src="js/public/pub-map.jsx" data-presets="react"></script>

<script type="text/babel" data-presets="react">
fetch('assets/logo/mark.svg')
  .then((r) => r.text())
  .then((svg) => { window.WGMark = svg.replace(/width="\d+"/, '').replace(/height="\d+"/, '').replace(/<svg([^>]*)>/, '<svg$1 style="width:100%;height:100%" preserveAspectRatio="xMidYMid meet">'); })
  .catch(() => {})
  .finally(() => { ReactDOM.createRoot(document.getElementById('root')).render(<window.PubMapApp />); });
</script>
</body>
</html>

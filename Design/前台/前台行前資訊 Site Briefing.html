<script type="text/babel" data-presets="react">
/* /brief — 靜態內容頁。
 * 與 /map、/list 不同，這一頁**沒有路由狀態**（沒有圖層、篩選、選取的標記），
 * 所以不用 useSiteRouteState —— 只給 SiteShell 一份預設 state，讓側欄那兩個
 * 連結（地圖／列表）點過去有合理的落點。 */
function SiteBriefingPage() {
  const [session] = useSitePersona();
  const state = { dataType: 'station', subDataTypes: [] };
  return (
    <SiteShell module="brief" state={state} search=""
      onSearchChange={(value) => {
        /* 這一頁沒有東西可搜。在這裡打字的人要找的是站點或任務 —— 帶他過去，
           而不是讓輸入框看起來壞掉。 */
        const v = (value || '').trim();
        if (v) window.location.href = encodeURI('前台列表 Site List.html') + '#/list/station?search=' + encodeURIComponent(v);
      }}
      isAuthenticated={session.isAuthenticated} platformRole={session.platformRole} userName={session.userName}
      onSignIn={() => window.SiteAuth.goSignIn()}
      onSignOut={() => window.SiteAuth.signOutHere()}>
      <SiteBriefingView />
    </SiteShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SiteBriefingPage />);
</script>

# ─── Dedup (pre-submit soft hint) ─────────────────────────────

query TicketDedupCandidates($input: TicketDedupCheckInput!) {
  ticketDedupCandidates(input: $input) {
    relatedTicketUuid
    relatedTaskUuid
    similarity
    scoreComponents {
      name
      score
      weight
      passed
    }
  }
}

mutation RecordDedupHintOutcome($input: RecordDedupHintOutcomeInput!) {
  recordDedupHintOutcome(input: $input) {
    auditEventUuid
    hintOutcome
    pairUuid
  }
}

fragment TicketSummaryFields on TicketType {
  uuid
  title
  status
  taskType
  createdAt
  geometry
}

query GetTicketSummary($uuid: UUID!) {
  ticket(uuid: $uuid) {
    ...TicketSummaryFields
    tasks {
      uuid
      taskName
    }
  }
}

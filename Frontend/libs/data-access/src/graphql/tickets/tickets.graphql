fragment TicketFields on TicketType {
  uuid
  propertyName
  geometry
  # H3 cell `geometry` stands in for when the caller only gets a region (ADR-281); null = exact.
  locationCell
  title
  description
  contactName
  contactEmail
  contactPhone
  status
  priority
  taskType
  visibility
  verificationStatus
  reviewNote
  createdBy
  createdAt
  updatedAt
}

fragment TicketTaskFields on TicketTaskType {
  uuid
  ticketUuid
  taskType
  taskName
  taskDescription
  quantity
  status
  source
  progressNote
  visibility
  moderationStatus
  reviewNote
  createdAt
  updatedAt
}

# What a need's claim button is decided on (ticket/needs/need-claim.ts): a volunteer claims a need,
# not a ticket (PUB-PS-140). `myAssignment` is null to a guest and to anyone who has not claimed it;
# `assignedCount` is public, the claimants themselves are not (`assignments` needs ticket.view_pii).
fragment TicketNeedFields on TicketTaskType {
  uuid
  taskName
  taskType
  quantity
  status
  assignedCount
  myAssignment {
    uuid
  }
}

# ─── Queries ────────────────────────────────────────────────

query GetTickets(
  $bounds: BoundsInput
  $status: String
  $priority: String
  $skip: Int = 0
  $limit: Int = 50
  $zoom: Float
) {
  tickets(
    bounds: $bounds
    status: $status
    priority: $priority
    skip: $skip
    limit: $limit
    zoom: $zoom
  ) {
    items {
      ...TicketFields
    }
    pageInfo {
      totalCount
      hasNextPage
      hasPreviousPage
    }
  }
}

query GetTicket($uuid: UUID!) {
  ticket(uuid: $uuid) {
    ...TicketFields
    photos {
      uuid
      url
      createdBy
      createdAt
    }
    tasks {
      ...TicketTaskFields
      ...TicketNeedFields
    }
  }
}

query GetTicketTasks(
  $ticketUuid: String!
  $status: String
  $skip: Int = 0
  $limit: Int = 50
) {
  ticketTasks(
    ticketUuid: $ticketUuid
    status: $status
    skip: $skip
    limit: $limit
  ) {
    ...TicketTaskFields
    properties {
      uuid
      taskUuid
      propertyName
      propertyValue
      quantity
      status
      comment
      createdAt
    }
  }
}

# ─── Mutations ──────────────────────────────────────────────

mutation CreateTicket($input: CreateTicketInput!) {
  createTicket(input: $input) {
    ...TicketFields
  }
}

mutation UpdateTicket($uuid: UUID!, $input: UpdateTicketInput!) {
  updateTicket(uuid: $uuid, input: $input) {
    ...TicketFields
  }
}

mutation CreateTicketTask($input: CreateTicketTaskInput!) {
  createTicketTask(input: $input) {
    ...TicketTaskFields
  }
}

mutation UpdateTicketTask($uuid: UUID!, $input: UpdateTicketTaskInput!) {
  updateTicketTask(uuid: $uuid, input: $input) {
    ...TicketTaskFields
  }
}

# The caller claims a need for themselves: no actorUuid means self-signup (ticket.assign: own).
mutation ClaimNeed($taskUuid: UUID!) {
  assignTaskActor(taskUuid: $taskUuid) {
    uuid
    taskUuid
  }
}

mutation CreateTaskProperty($input: CreateTaskPropertyInput!) {
  createTaskProperty(input: $input) {
    uuid
    taskUuid
    propertyName
    propertyValue
    quantity
    status
    comment
    createdAt
  }
}

fragment PageInfoFields on PageInfo {
  totalCount
  hasNextPage
  hasPreviousPage
}

# No `comment`: the back office's internal note, read only by those with station.view_pii (ADR-332).
fragment StationFields on StationType {
  uuid
  propertyName
  geometry
  type
  name
  description
  opHour
  level
  source
  visibility
  verificationStatus
  isDuplicate
  isTemporary
  isOfficial
  operationalStatus
  supplyStatus
  supplyStatusUpdatedAt
  createdBy
  createdAt
  updatedAt
}

fragment ClosureAreaFields on HazardousZoneType {
  uuid
  propertyName
  name
  geometry
  status
  informationSource
  note
  createdBy
  createdAt
  updatedAt
}

# ─── Queries ────────────────────────────────────────────────

query GetStations(
  $bounds: BoundsInput
  $stationType: String
  $skip: Int = 0
  $limit: Int = 50
) {
  stations(
    bounds: $bounds
    stationType: $stationType
    skip: $skip
    limit: $limit
  ) {
    items {
      ...StationFields
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

query GetStation($uuid: UUID!) {
  station(uuid: $uuid) {
    ...StationFields
    secondaryLocation {
      uuid
      locationType
      fullAddress
      county
      town
      village
      neighborhood
      road
      section
      lane
      alley
      no
      normalizationStatus
      floor
      room
      poleId
      poleType
      poleNote
    }
    properties {
      uuid
      stationUuid
      propertyType
      propertyName
      quantity
      comment
      status
      weightings
      createdBy
      createdAt
    }
  }
}

# The public map's areas, all three kinds at once (ADR-311): every 危險區 and 責任區, and the 標示區
# switched to public. A team zone names its teams (ADR-311 point 8).
# `includePrivate` adds the 標示區 not switched to public; it needs `work_zone.view` (the admin 互助地圖).
query GetMapAreas(
  $bounds: BoundsInput
  $includePrivate: Boolean = false
  $skip: Int = 0
  $limit: Int = 50
) {
  areas(
    bounds: $bounds
    includePrivate: $includePrivate
    skip: $skip
    limit: $limit
  ) {
    items {
      uuid
      type
      name
      note
      geometry
      isPublic
      assignedTeams {
        uuid
        name
      }
    }
    pageInfo {
      ...PageInfoFields
    }
  }
}

query GetClosureArea($uuid: UUID!) {
  hazardousZone(uuid: $uuid) {
    ...ClosureAreaFields
  }
}

# The nearest 門牌 to a pin, and a typed line checked, against TGOS. Signed-in callers only, 30 lookups a
# minute between the two. Fields written out rather than shared in a fragment, which would be masked.
# How a form uses them: modules `ticket/address-lookup.ts`.
query ReverseGeocode($lat: Float!, $lng: Float!) {
  reverseGeocode(lat: $lat, lng: $lng) {
    status
    fullAddress
    lat
    lng
    buildingSection
    floor
    room
    addressToken
  }
}

query NormalizeAddress($address: String!, $lat: Float, $lng: Float) {
  normalizeAddress(address: $address, lat: $lat, lng: $lng) {
    status
    fullAddress
    lat
    lng
    buildingSection
    floor
    room
    addressToken
  }
}

# ─── Mutations ──────────────────────────────────────────────

mutation UpdateStation($uuid: UUID!, $input: UpdateStationInput!) {
  updateStation(uuid: $uuid, input: $input) {
    ...StationFields
  }
}

mutation DeleteStation($uuid: UUID!) {
  deleteStation(uuid: $uuid)
}

mutation CreateStationProperty($input: CreateStationPropertyInput!) {
  createStationProperty(input: $input) {
    uuid
    stationUuid
    propertyType
    propertyName
    quantity
    status
    weightings
    createdBy
    createdAt
  }
}

mutation CreateCrowdSourcing($input: CreateCrowdSourcingInput!) {
  createCrowdSourcing(input: $input) {
    uuid
    stationUuid
    itemUuid
    rating
    createdAt
  }
}

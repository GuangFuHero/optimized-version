  """UUID of the user who created this announcement"""
  createdBy: String
  createdAt: DateTime
  updatedAt: DateTime
}

type AssignedTeamType {
  uuid: UUID!
  name: String!
  type: String!
}

input BoundsInput {
  """South boundary latitude"""
  minLat: Float!

  """North boundary latitude"""
  maxLat: Float!

  """West boundary longitude"""
  minLng: Float!

  """East boundary longitude"""
  maxLng: Float!
}

type ClosureAreaConnection {
  items: [ClosureAreaType!]!
  pageInfo: PageInfo!
}

type ClosureAreaType {
  uuid: UUID!

  """Internal polymorphic discriminator — always 'closure_area'"""
  propertyName: String!

  """GeoJSON Polygon or MultiPolygon marking the closed area"""
  geometry: GeoJSON

  """UUID of the user who reported this closure"""
  createdBy: String

  """Current closure status: 'dangerous', 'block'"""
  status: String!

  """Source of the closure report, e.g. agency name or URL"""
  informationSource: String

  """Additional notes about this closure"""
  comment: String
  createdAt: DateTime
  updatedAt: DateTime
}

input CreateAnnouncementInput {
  """The announcement body text"""
  content: String!
}

input CreateClosureAreaInput {
  """GeoJSON Polygon or MultiPolygon — must not be a Point"""
  geometry: GeoJSON!

  """Initial closure status: 'active', 'cleared', or 'unknown'"""
  status: String!

  """Source of the closure report, e.g. agency name or URL"""
  informationSource: String = null
  comment: String = null
}

input CreateCrowdSourcingInput {
  """UUID of the station being rated"""
  stationUuid: String!

  """
  UUID of the StationProperty being rated — null for a general station rating
  """
  itemUuid: String = null

  """Rating value: 'up', 'neutral', or 'down'"""
  rating: String!

  """Distance in meters from the user to the station at time of submission"""
  distanceFromGeometry: Float = null
}

input CreateStationInput {
  """GeoJSON Point — must be a valid Point within lon/lat bounds"""
  geometry: GeoJSON!

  """Station category, e.g. 'shelter', 'supply', 'medical'"""
  type: String = null
  name: String = null
  description: String = null

  """Operating hours in free-text format"""
  opHour: String = null

  """Importance level for map rendering (0 = default)"""
  level: Int! = 0
  comment: String = null

  """Data origin: 'user' (default) or 'official'"""
  source: String! = "user"

  """Visibility: 'public' (default), 'restricted', or 'internal'"""
  visibility: Visibility! = public

  """Optional station contact name"""
  contactName: String = null

  """Optional station contact email"""
  contactEmail: String = null

  """Optional station contact phone"""
  contactPhone: String = null

  """Optional secondary address or pole location to attach to this station"""
  secondaryLocation: SecondaryLocationInput = null
}

input CreateStationPropertyInput {
  """UUID of the station to attach this property to"""
  stationUuid: String!

  """Category: 'supply', 'service', or 'equipment'"""
  propertyType: String!

  """Specific item name matching the property config schema"""
  propertyName: String!
  quantity: Int = null

  """Initial credibility weight [0.0–2.0], default 1.0"""
  weightings: Float! = 1
}

input CreateStationSuggestionInput {
  """'station' or 'station_property'"""
  targetType: String!

  """UUID of the station/property to change"""
  targetUuid: UUID!

  """Which field to change (see suggestableFields)"""
  fieldName: String!

  """Proposed new value as text"""
  newValue: String!

  """Why the change is suggested"""
  comment: String = null
}

input CreateTaskPropertyInput {
  """UUID of the task to attach this property to"""
  taskUuid: String!

  """Attribute key matching the task property config schema"""
  propertyName: String!

  """Value for the attribute"""
  propertyValue: String!

  """Number of units — null if not applicable"""
  quantity: Int = null
  comment: String = null
}

input CreateTicketInput {
  title: String!
  description: String = null

  """
  GeoJSON Point for the location where help is needed — [longitude, latitude]
  """
  geometry: GeoJSON!

  """Full name of the requester"""
  contactName: String!

  """Optional email for follow-up"""
  contactEmail: String = null

  """Optional phone number for follow-up"""
  contactPhone: String = null

  """Urgency: 'low' (default), 'medium', 'high', or 'critical'"""
  priority: String! = "low"

  """Type of help: 'rescue', 'supply', 'medical', or 'hr'"""
  taskType: String = null

  """Visibility: 'public' (default), 'restricted', or 'internal'"""
  visibility: Visibility! = public

  """Type of disaster, e.g. 'earthquake', 'flood'"""
  disasterType: String = null

  """
  Optional street address for the request, normalized and validated on write. Needs no table of its own: secondary_locations keys on base_geometries.uuid, and a ticket IS a base_geometry.
  """
  secondaryLocation: SecondaryLocationInput = null
}

input CreateTicketTaskInput {
  """UUID of the ticket this task belongs to"""
  ticketUuid: String!

  """Category: 'rescue', 'supply', 'medical', or 'hr'"""
  taskType: String!
  taskName: String!
  taskDescription: String = null

  """Number of people or units needed"""
  quantity: Int = null

  """Origin: 'user' (default) or 'official'"""
  source: String! = "user"

  """Visibility: 'public' (default), 'restricted', or 'internal'"""
  visibility: Visibility! = public

  """Optional UUID of an associated route"""
  routeUuid: String = null
}

input CreateWorkZoneInput {
  name: String!

  """GeoJSON Polygon or MultiPolygon — must not be a Point"""
  geometry: GeoJSON!
}

type CrowdSourcingType {
  uuid: UUID!

  """UUID of the station being rated"""
  stationUuid: String!

  """UUID of the specific StationProperty being rated"""
  itemUuid: String

  """UUID of the user who submitted this rating"""
  userUuid: String!

  """Credibility score of the submitter at the time of submission"""
  userCredibilityScore: Float!

  """User-submitted rating: 'up', 'neutral', or 'down'"""
  rating: String!

  """
  Distance in meters between the user's location and the station at submission time
  """
  distanceFromGeometry: Float
  createdAt: DateTime
}

"""Date with time (isoformat)"""
scalar DateTime

"""GeoJSON geometry object (RFC 7946)"""
scalar GeoJSON

type Mutation {
  createStation(input: CreateStationInput!): StationType!
  attachStationPhoto(stationUuid: UUID!, url: String!): PhotoType!
  detachStationPhoto(uuid: UUID!): Boolean!
  updateStation(uuid: UUID!, input: UpdateStationInput!): StationType!
  deleteStation(uuid: UUID!): Boolean!
  createClosureArea(input: CreateClosureAreaInput!): ClosureAreaType!
  updateClosureArea(uuid: UUID!, input: UpdateClosureAreaInput!): ClosureAreaType!
  deleteClosureArea(uuid: UUID!): Boolean!
  createStationProperty(input: CreateStationPropertyInput!): StationPropertyType!
  updateStationProperty(uuid: UUID!, input: UpdateStationPropertyInput!): StationPropertyType!
  createCrowdSourcing(input: CreateCrowdSourcingInput!): CrowdSourcingType!
  createTicket(input: CreateTicketInput!): TicketType!
  updateTicket(uuid: UUID!, input: UpdateTicketInput!): TicketType!
  reviewTicket(uuid: UUID!, verificationStatus: String!, reviewNote: String = null): TicketType!
  deleteTicket(uuid: UUID!): Boolean!
  createTicketTask(input: CreateTicketTaskInput!): TicketTaskType!
  updateTicketTask(uuid: UUID!, input: UpdateTicketTaskInput!): TicketTaskType!
  createTaskProperty(input: CreateTaskPropertyInput!): TaskPropertyType!
  updateTaskProperty(uuid: UUID!, input: UpdateTaskPropertyInput!): TaskPropertyType!
  assignTaskActor(taskUuid: UUID!, actorUuid: UUID = null, role: String = null): TaskAssignmentType!
  updateTaskAssignment(uuid: UUID!, input: UpdateTaskAssignmentInput!): TaskAssignmentType!
  unassignTaskActor(uuid: UUID!): Boolean!
  upsertStationPropertyConfig(stationType: String!, input: UpsertPropertyConfigInput!): StationPropertyConfigType!
  upsertTaskPropertyConfig(taskType: String!, input: UpsertPropertyConfigInput!): TaskPropertyConfigType!
  createAnnouncement(input: CreateAnnouncementInput!): AnnouncementType!
  updateAnnouncement(uuid: UUID!, input: UpdateAnnouncementInput!): AnnouncementType!
  moveAnnouncement(uuid: UUID!, direction: AnnouncementMoveDirection!): AnnouncementType!
  setAnnouncementActive(uuid: UUID!, active: Boolean!): AnnouncementType!
  deleteAnnouncement(uuid: UUID!): Boolean!
  createStationSuggestion(input: CreateStationSuggestionInput!): StationSuggestionType!
  reviewStationSuggestion(uuid: UUID!, approve: Boolean!, reviewNote: String = null): StationSuggestionType!
  createWorkZone(input: CreateWorkZoneInput!): WorkZoneType!
  updateWorkZone(uuid: UUID!, input: UpdateWorkZoneInput!): WorkZoneType!
  assignZoneToTeam(input: ZoneTeamAssignmentInput!): ZoneAssignmentType!
  removeZoneFromTeam(input: ZoneTeamAssignmentInput!): Boolean!
  deleteWorkZone(uuid: UUID!): Boolean!
}

input NormalizeAddressInput {
  """Full address as typed, e.g. '花蓮縣光復鄉中興路10號'"""
  raw: String = null

  """Latitude (WGS84)"""
  lat: Float = null

  """Longitude (WGS84)"""
  lng: Float = null

  """Max suggestions when resolving from a coordinate (clamped to 1–50)"""
  limit: Int! = 5
}

type NormalizedAddressType {
  """
  False when the input could not be resolved at all — NOT an error; read `issues`
  """
  normalizable: Boolean!

  """'verified' | 'corrected' | 'unverified' | 'pin_mismatch'"""
  status: String!

  """Canonical single-line address, e.g. '花蓮縣光復鄉大全村中興路10號'"""
  formatted: String
  county: String

  """鄉鎮市區"""
  town: String

  """村里"""
  village: String
  road: String

  """段"""
  section: String

  """巷"""
  lane: String

  """弄"""
  alley: String

  """號"""
  no: String

  """樓"""
  floor: String

  """室"""
  room: String
  lat: Float
  lng: Float

  """Metres between the supplied pin and the matched address point"""
  distanceM: Float

  """Human-readable reasons the status is not 'verified'; empty when it is"""
  issues: [String!]!
  suggestions: [AddressSuggestionType!]!
}

type PageInfo {
  """Total number of matching records across all pages"""
  totalCount: Int!

  """True if there are more records after the current page"""
  hasNextPage: Boolean!

  """True if there are records before the current page"""
  hasPreviousPage: Boolean!
}

type PhotoType {
  uuid: UUID!

  """UUID of the parent entity this photo is attached to"""
  refUuid: String!

  """
  'geometry' (attached to a ticket or station) or 'pole' (attached to a secondary_location)
  """
  refType: String!

  """Public URL of the uploaded photo"""
  url: String!

  """UUID of the user who uploaded this photo"""
  createdBy: String!
  createdAt: DateTime
}

type Query {
  normalizeAddress(input: NormalizeAddressInput!): NormalizedAddressType!
  referenceData: [ReferenceDatasetType!]!
  stations(bounds: BoundsInput = null, stationType: String = null, skip: Int! = 0, limit: Int! = 50): StationConnection!
  station(uuid: UUID!): StationType
  closureAreas(bounds: BoundsInput = null, skip: Int! = 0, limit: Int! = 50): ClosureAreaConnection!
  closureArea(uuid: UUID!): ClosureAreaType
  tickets(bounds: BoundsInput = null, status: String = null, priority: String = null, skip: Int! = 0, limit: Int! = 50): TicketConnection!
  ticket(uuid: UUID!): TicketType
  ticketTasks(ticketUuid: String!, status: String = null, skip: Int! = 0, limit: Int! = 50): [TicketTaskType!]!
  taskProperties(taskUuid: String!): [TaskPropertyType!]!
  stationPropertyConfigs(stationType: String!): [StationPropertyConfigType!]!
  taskPropertyConfigs(taskType: String!): [TaskPropertyConfigType!]!
  announcements(filter: AnnouncementFilter! = ACTIVE): [AnnouncementType!]!
  announcement(uuid: UUID!): AnnouncementType
  suggestableFields(targetType: String!): [SuggestableFieldType!]!
  stationSuggestions(status: String = null, targetUuid: String = null, skip: Int! = 0, limit: Int! = 50): [StationSuggestionType!]!
  workZones(skip: Int! = 0, limit: Int! = 50): WorkZoneConnection!
  workZone(uuid: UUID!): WorkZoneType
  zonesByTeam(teamUuid: UUID!, skip: Int! = 0, limit: Int! = 50): WorkZoneConnection!
}

type ReferenceDatasetType {
  """'ref_roads' | 'ref_villages' | 'osm_address_points'"""
  name: String!

  """'pending' | 'downloading' | 'importing' | 'ready' | 'failed'"""
  status: String!
  sourceVersion: String
  rowCount: Int
  startedAt: DateTime
  finishedAt: DateTime
  error: String
}

input SecondaryLocationInput {
  """Type of secondary location: 'address' (default) or 'pole'"""
  locationType: String! = "address"

  """
  Full address as typed, e.g. '花蓮縣光復鄉中興路10號'. Wins over the fields below.
  """
  raw: String = null
  county: String = null

  """鄉鎮市區"""
  town: String = null

  """村里"""
  village: String = null
  road: String = null

  """段"""
  section: String = null
  lane: String = null
  alley: String = null
  no: String = null
  floor: String = null
  room: String = null
  poleId: String = null
  poleType: String = null
  poleNote: String = null
}

type SecondaryLocationType {
  uuid: UUID!

  """UUID of the parent station this location belongs to"""
  geometryUuid: String!

  """Type of secondary location: 'address' or 'pole'"""
  locationType: String!
  county: String

  """鄉鎮市區 (replaced the old `city`)"""
  town: String

  """村里"""
  village: String
  road: String

  """段"""
  section: String
  lane: String
  alley: String
  no: String
  floor: String
  room: String

  """
  Canonical single-line address, masked from 巷 onward without the parent's view_pii
  """
  formatted: String

  """
  How far validation got: 'verified' | 'corrected' | 'unverified' | 'pin_mismatch'
  """
  normalizationStatus: String

  """Utility pole identifier (only set when location_type is 'pole')"""
  poleId: String

  """
  Type of utility pole, e.g. '電線桿' (electricity pole), '電話線桿' (telephone pole)
  """
  poleType: String

  """Additional notes about the pole location"""
  poleNote: String
}

type StationConnection {
  items: [StationType!]!
  pageInfo: PageInfo!
}

type StationPropertyConfigType {
  uuid: UUID!

  """
  The station type this config applies to, or 'all' for universal properties
  """
  stationType: String!

  """The property key this config defines, e.g. 'water', 'food_ration'"""
  propertyName: String!

  """Expected data type: 'string', 'integer', 'float', or 'enum'"""
  dataType: String!

  """
  Allowed values when data_type is 'enum', e.g. ['available', 'depleted']
  """
  enumOptions: [String!]
}

type StationPropertyType {
  uuid: UUID!

  """UUID of the parent station this property belongs to"""
  stationUuid: String!

  """Category of this property, e.g. 'supply', 'service', 'equipment'"""
  propertyType: String!

  """Specific item name, e.g. 'water', 'food_ration', 'medical_kit'"""
  propertyName: String!

  """Available quantity — null means unknown"""
  quantity: Int
  comment: String

  """Review state: 'pending', 'verified', or 'rejected'"""
  status: String!

  """
  Credibility weight applied during score aggregation [0.0–2.0], default 1.0
  """
  weightings: Float!

  """UUID of the user who added this property"""
  createdBy: String
  createdAt: DateTime
  crowdSourcings: [CrowdSourcingType!]!
}

type StationSuggestionType {
  uuid: UUID!

  """What the suggestion targets: 'station' or 'station_property'"""
  targetType: String!

  """UUID of the targeted station/property"""
  targetUuid: String!
  fieldName: String!

  """Proposed value, stored as text"""
  newValue: String!

  """Why the user suggests this change"""
  comment: String

  """'pending', 'approved', or 'rejected'"""
  status: String!

  """Admin's note recorded when approving/rejecting"""
  reviewNote: String

  """UUID of the admin who decided"""
  reviewedBy: String

  """UUID of the user who made the suggestion"""
  createdBy: String
  createdAt: DateTime
  updatedAt: DateTime
}

type StationType {
  uuid: UUID!

  """Internal polymorphic discriminator — always 'station'"""
  propertyName: String!

  """
  GeoJSON geometry — Point for a station location, Polygon/MultiPolygon for an area
  """
  geometry: GeoJSON

  """UUID of the user who created this station"""
  createdBy: String

  """Station category, e.g. 'shelter', 'supply', 'medical'"""
  type: String
  name: String
  description: String

  """Operating hours in free-text format, e.g. '09:00–18:00' or '24h'"""
  opHour: String

  """Importance level used for map rendering priority (0 = default)"""
  level: Int!

  """Internal admin comment, not shown to the public"""
  comment: String

  """Data source of this record: 'user' or 'official'"""
  source: String

  """Who can see this station: 'public' or 'restricted'"""
  visibility: String

  """Review state: 'unverified', 'ai_verified', or 'human_verified'"""
  verificationStatus: String

  """Aggregate credibility score based on crowd-sourced ratings [0.0–1.0]"""
  confidenceScore: Float

  """True if this station has been flagged as a duplicate entry"""
  isDuplicate: Boolean!

  """True if this is a temporary station (e.g. emergency shelter)"""
  isTemporary: Boolean!

  """True if this station is operated by a government or official body"""
  isOfficial: Boolean!

  """
  Computed urgency score used for display ordering — higher is more urgent
  """
  priorityScore: Float
  createdAt: DateTime
  updatedAt: DateTime

  """
  Station contact name — masked unless the caller holds station.view_pii here
  """
  contactName: String

  """
  Station contact email — masked unless the caller holds station.view_pii here
  """
  contactEmail: String

  """
  Station contact phone — masked unless the caller holds station.view_pii here
  """
  contactPhone: String
  photos: [PhotoType!]!

  """
  Address or pole location — the address is masked without station.view_pii here
  """
  secondaryLocation: SecondaryLocationType
  properties: [StationPropertyType!]!
}

type SuggestableFieldType {
  fieldName: String!

  """Input widget hint: 'string', 'integer', or 'enum'"""
  dataType: String!

  """Allowed values when data_type is 'enum', else null"""
  enumOptions: [String!]
}


    """Only tickets at this audit status"""
    auditStatus: AuditStatus = null

    """
    NEWEST (default): newest first, best match first when searching. NEEDS_FIRST: tickets still taking people first, one with an open rescue need ahead, then as NEWEST; a need the signed-in caller claimed counts as open
    """

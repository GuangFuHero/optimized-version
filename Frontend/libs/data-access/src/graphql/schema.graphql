  ): TicketConnection!
  ticketCells(
    bounds: BoundsInput!

    """
    Map zoom the result is for. Only affects a caller without ticket.view_detail: sets how coarse the H3 cell standing in for each point is — coarser as the map zooms out, never finer than resolution 8 whatever is sent
    """
    zoom: Float = null

    """
    Only tickets in one of these statuses, as the map's filter ticks several; a status given more than once counts once. Leave it out to match every status, as the site does when its filter means all of them: an empty list matches none
    """
    statuses: [TicketStatus!] = null
  ): [TicketCellType!]!

  """
  Whether ticket(uuid) gives this ticket, and if not, whether it was merged into another, deleted, or never was, so a share link can say which and send a merged one on. Ask it beside ticket(uuid). The state and the kept ticket's uuid alone, nothing of the ticket (ADR-444)
  """
  ticketAvailability(uuid: UUID!): TicketAvailabilityType!
  ticket(
    uuid: UUID!

    """
    Map zoom the result is for. Only affects a caller without ticket.view_detail: sets how coarse the H3 cell standing in for each point is — coarser as the map zooms out, never finer than resolution 8 whatever is sent
    """
    zoom: Float = null
  ): TicketType
  myTickets: [TicketType!]!
  buildingMapTickets(buildingMapUuid: UUID!, skip: Int! = 0, limit: Int! = 100): [TicketType!]!
  ticketTasks(ticketUuid: String!, status: String = null, q: String = null, skip: Int! = 0, limit: Int! = 50): [TicketTaskType!]!
  myTaskAssignments: [MyTaskAssignmentType!]!
  taskProperties(taskUuid: String!): [TaskPropertyType!]!
  stationPropertyConfigs(stationType: String!, includeInactive: Boolean! = false): [StationPropertyConfigType!]!
  taskPropertyConfigs(taskType: String!, includeInactive: Boolean! = false): [TaskPropertyConfigType!]!
  ticketPropertyConfigs(disasterTypes: [String!]!, includeInactive: Boolean! = false): [TicketPropertyConfigType!]!
  disasterTypes(includeInactive: Boolean! = false): [DisasterTypeType!]!

  """
  The deployment's disaster, readable without signing in; null until first configured
  """
  currentDisaster: CurrentDisasterType
  announcements(filter: AnnouncementFilter! = ACTIVE, placement: AnnouncementPlacement! = public_page): [AnnouncementType!]!
  announcement(uuid: UUID!): AnnouncementType
  briefingTemplates(state: BriefingState = null, tag: String = null): [BriefingTemplateType!]!
  briefingTemplate(uuid: UUID!): BriefingTemplateType
  briefings(state: BriefingState = null, tag: String = null, status: BriefingStatusFilter! = PUBLISHED): [BriefingType!]!
  briefing(uuid: UUID!): BriefingType
  suggestableFields(targetType: String!): [SuggestableFieldType!]!
  areas(bounds: BoundsInput = null, includePrivate: Boolean! = false, skip: Int! = 0, limit: Int! = 50): AreaConnection!
  teamZones(bounds: BoundsInput = null, skip: Int! = 0, limit: Int! = 50): TeamZoneConnection!
  teamZone(uuid: UUID!): TeamZoneType

  updatedAt: DateTime
}

type BriefingType {
  uuid: UUID!

  """UUID of the source template, or null for ad-hoc briefings"""
  templateUuid: UUID
  content: String!

  """Free-form categorization tags"""
  tags: [String!]!

  """Lifecycle phase: 'briefing', 'in_field', or 'debrief'"""

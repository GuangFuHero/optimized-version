  createStation(input: CreateStationInput!): StationType!
  attachStationPhoto(stationUuid: UUID!, url: String!): PhotoType!
  detachStationPhoto(uuid: UUID!): Boolean!
  updateStation(uuid: UUID!, input: UpdateStationInput!): StationType!
  deleteStation(uuid: UUID!): Boolean!
  createClosureArea(input: CreateClosureAreaInput!): ClosureAreaType!
  updateClosureArea(uuid: UUID!, input: UpdateClosureAreaInput!): ClosureAreaType!
  deleteClosureArea(uuid: UUID!): Boolean!
  createStationProperty(input: CreateStationPropertyInput!): StationPropertyType!
  updateStationProperty(uuid: UUID!, input: UpdateStationPropertyInput!): StationPropertyType!
  createCrowdSourcing(input: CreateCrowdSourcingInput!): CrowdSourcingType!
  createTicket(input: CreateTicketInput!): TicketType!
  updateTicket(uuid: UUID!, input: UpdateTicketInput!): TicketType!
  setTicketDisasterDetails(uuid: UUID!, details: [TicketDisasterDetailInput!]!): [TicketDisasterDetailType!]!
  reviewTicket(uuid: UUID!, verificationStatus: String!, reviewNote: String = null): TicketType!
  deleteTicket(uuid: UUID!): Boolean!
  createTicketTask(input: CreateTicketTaskInput!): TicketTaskType!
  updateTicketTask(uuid: UUID!, input: UpdateTicketTaskInput!): TicketTaskType!
  createTaskProperty(input: CreateTaskPropertyInput!): TaskPropertyType!
  updateTaskProperty(uuid: UUID!, input: UpdateTaskPropertyInput!): TaskPropertyType!
  assignTaskActor(taskUuid: UUID!, actorUuid: UUID = null, role: String = null): TaskAssignmentType!
  updateTaskAssignment(uuid: UUID!, input: UpdateTaskAssignmentInput!): TaskAssignmentType!
  unassignTaskActor(uuid: UUID!): Boolean!
  upsertStationPropertyConfig(stationType: String!, input: UpsertPropertyConfigInput!): StationPropertyConfigType!
  upsertTaskPropertyConfig(taskType: String!, input: UpsertPropertyConfigInput!): TaskPropertyConfigType!
  upsertTicketPropertyConfig(input: UpsertTicketPropertyConfigInput!): TicketPropertyConfigType!
  upsertDisasterType(input: UpsertDisasterTypeInput!): DisasterTypeType!
  createAnnouncement(input: CreateAnnouncementInput!): AnnouncementType!
  updateAnnouncement(uuid: UUID!, input: UpdateAnnouncementInput!): AnnouncementType!
  moveAnnouncement(uuid: UUID!, direction: AnnouncementMoveDirection!): AnnouncementType!
  setAnnouncementActive(uuid: UUID!, active: Boolean!): AnnouncementType!
  deleteAnnouncement(uuid: UUID!): Boolean!
  createBriefingTemplate(input: CreateBriefingTemplateInput!): BriefingTemplateType!
  updateBriefingTemplate(uuid: UUID!, input: UpdateBriefingTemplateInput!): BriefingTemplateType!
  deleteBriefingTemplate(uuid: UUID!): Boolean!
  generateBriefing(input: GenerateBriefingInput!): BriefingType!
  updateBriefing(uuid: UUID!, input: UpdateBriefingInput!): BriefingType!
  deleteBriefing(uuid: UUID!): Boolean!
  createStationSuggestion(input: CreateStationSuggestionInput!): StationSuggestionType!
  reviewStationSuggestion(uuid: UUID!, approve: Boolean!, reviewNote: String = null): StationSuggestionType!
  createWorkZone(input: CreateWorkZoneInput!): WorkZoneType!
  updateWorkZone(uuid: UUID!, input: UpdateWorkZoneInput!): WorkZoneType!
  assignZoneToTeam(input: ZoneTeamAssignmentInput!): ZoneAssignmentType!
  removeZoneFromTeam(input: ZoneTeamAssignmentInput!): Boolean!
  deleteWorkZone(uuid: UUID!): Boolean!
}

type PageInfo {
  """Total number of matching records across all pages"""
  totalCount: Int!

  """True if there are more records after the current page"""
  hasNextPage: Boolean!

  """True if there are records before the current page"""
  hasPreviousPage: Boolean!
}

type PhotoType {
  uuid: UUID!

  """UUID of the parent entity this photo is attached to"""
  refUuid: String!

  """
  'geometry' (attached to a ticket or station) or 'pole' (attached to a secondary_location)
  """
  refType: String!

  """Public URL of the uploaded photo"""
  url: String!

  """UUID of the user who uploaded this photo"""
  createdBy: String!
  createdAt: DateTime
}

type Query {
  stations(bounds: BoundsInput = null, stationType: String = null, operationalStatus: StationOperationalStatus = null, q: String = null, skip: Int! = 0, limit: Int! = 50): StationConnection!
  station(uuid: UUID!): StationType
  closureAreas(bounds: BoundsInput = null, skip: Int! = 0, limit: Int! = 50): ClosureAreaConnection!
  closureArea(uuid: UUID!): ClosureAreaType
  tickets(
    bounds: BoundsInput = null
    status: String = null
    priority: String = null
    q: String = null
    skip: Int! = 0
    limit: Int! = 50

    """
    Map zoom the result is for. Only affects a caller without ticket.view_detail: sets how coarse the H3 cell standing in for each point is — coarser as the map zooms out, never finer than resolution 8 whatever is sent
    """
    zoom: Float = null
  ): TicketConnection!
  ticket(
    uuid: UUID!

    """
    Map zoom the result is for. Only affects a caller without ticket.view_detail: sets how coarse the H3 cell standing in for each point is — coarser as the map zooms out, never finer than resolution 8 whatever is sent
    """
    zoom: Float = null
  ): TicketType
  ticketTasks(ticketUuid: String!, status: String = null, q: String = null, skip: Int! = 0, limit: Int! = 50): [TicketTaskType!]!
  taskProperties(taskUuid: String!): [TaskPropertyType!]!
  stationPropertyConfigs(stationType: String!, includeInactive: Boolean! = false): [StationPropertyConfigType!]!
  taskPropertyConfigs(taskType: String!, includeInactive: Boolean! = false): [TaskPropertyConfigType!]!
  ticketPropertyConfigs(disasterTypes: [String!]!, includeInactive: Boolean! = false): [TicketPropertyConfigType!]!
  disasterTypes(includeInactive: Boolean! = false): [DisasterTypeType!]!
  announcements(filter: AnnouncementFilter! = ACTIVE): [AnnouncementType!]!
  announcement(uuid: UUID!): AnnouncementType
  briefingTemplates(state: BriefingState = null, tag: String = null): [BriefingTemplateType!]!
  briefingTemplate(uuid: UUID!): BriefingTemplateType
  briefings(state: BriefingState = null, tag: String = null): [BriefingType!]!
  briefing(uuid: UUID!): BriefingType
  suggestableFields(targetType: String!): [SuggestableFieldType!]!
  stationSuggestions(status: String = null, targetUuid: String = null, skip: Int! = 0, limit: Int! = 50): [StationSuggestionType!]!
  workZones(skip: Int! = 0, limit: Int! = 50): WorkZoneConnection!
  workZone(uuid: UUID!): WorkZoneType
  zonesByTeam(teamUuid: UUID!, skip: Int! = 0, limit: Int! = 50): WorkZoneConnection!
}

input SecondaryLocationInput {
  """Type of secondary location: 'address' (default) or 'pole'"""
  locationType: String! = "address"
  county: String = null
  city: String = null
  lane: String = null
  alley: String = null
  no: String = null

  """樓棟／區域, e.g. 'A棟'; leave empty if unknown"""
  buildingSection: String = null

  """Floor label: 'B1', '1F', 'RF'. Free text on purpose"""
  floor: String = null

  """房號／空間, e.g. '302', '樓梯間'"""
  room: String = null

  """空間描述, e.g. '三房兩廳'"""
  spaceDescription: String = null

  """求救者所在空間, e.g. '主臥衣櫃'"""
  victimSpace: String = null

  """Whether the space can be entered right now"""
  accessStatus: AccessStatus = null

  """地標補充 — entrance, landmark, building, which side of the road"""
  landmarkNote: String = null
  poleId: String = null
  poleType: String = null
  poleNote: String = null
}

type SecondaryLocationType {
  uuid: UUID!

  """UUID of the parent station or ticket this location belongs to"""
  geometryUuid: String!

  """Type of secondary location: 'address' or 'pole'"""
  locationType: String!
  county: String
  city: String
  lane: String
  alley: String
  no: String

  """樓棟／區域, e.g. 'A棟', '東翼'"""
  buildingSection: String

  """Floor label as spoken: 'B1', '1F', 'RF' — never coerced to a number"""
  floor: String

  """房號／空間, e.g. '302', '樓梯間'"""
  room: String

  """空間描述, e.g. '三房兩廳'"""
  spaceDescription: String

  """求救者所在空間, e.g. '主臥衣櫃'"""
  victimSpace: String

  """
  Whether the space can be entered: 'accessible', 'restricted', 'inaccessible', 'unknown'. A current observation, not a safety certification
  """
  accessStatus: String

  """地標補充 — how to find the entrance when coordinates are not enough"""
  landmarkNote: String

  """Utility pole identifier (only set when location_type is 'pole')"""
  poleId: String

  """
  Type of utility pole, e.g. '電線桿' (electricity pole), '電話線桿' (telephone pole)
  """
  poleType: String

  """Additional notes about the pole location"""
  poleNote: String
}

type StationConnection {
  items: [StationType!]!
  pageInfo: PageInfo!
}

enum StationOperationalStatus {
  active
  temporarily_closed
  permanently_closed
}

type StationPropertyConfigType {
  uuid: UUID!

  """
  The station type this config applies to, or 'all' for universal properties
  """
  stationType: String!

  """The property key this config defines, e.g. 'water', 'food_ration'"""
  propertyName: String!

  """Which control the form renders for this field"""
  dataType: FieldDataType!

  """
  Allowed values for single_select / multi_select, e.g. ['available', 'depleted']
  """
  enumOptions: [String!]

  """Unit suffix for a number field, e.g. 'cm'; null otherwise"""
  unit: String

  """Disaster types this field is enabled for; empty means every type"""
  disasterTypes: [String!]!

  """Display text; null when no custom label has been set"""
  label: String

  """Text to render: the label, falling back to property_name"""
  displayLabel: String!

  """Field order within the form"""
  sortOrder: Int!

  """Whether the field is in use"""
  isActive: Boolean!
}

type StationPropertyType {
  uuid: UUID!

  """UUID of the parent station this property belongs to"""
  stationUuid: String!

  """Category of this property, e.g. 'supply', 'service', 'equipment'"""
  propertyType: String!

  """Specific item name, e.g. 'water', 'food_ration', 'medical_kit'"""
  propertyName: String!

  """Available quantity — null means unknown"""
  quantity: Int
  comment: String

  """Review state: 'pending', 'verified', or 'rejected'"""
  status: String!

  """
  Credibility weight applied during score aggregation [0.0–2.0], default 1.0
  """
  weightings: Float!

  """UUID of the user who added this property"""
  createdBy: String
  createdAt: DateTime
  crowdSourcings: [CrowdSourcingType!]!
}

type StationSuggestionType {
  uuid: UUID!

  """What the suggestion targets: 'station' or 'station_property'"""
  targetType: String!

  """UUID of the targeted station/property"""
  targetUuid: String!
  fieldName: String!

  """Proposed value, stored as text"""
  newValue: String!

  """Why the user suggests this change"""
  comment: String

  """'pending', 'approved', or 'rejected'"""
  status: String!

  """Admin's note recorded when approving/rejecting"""
  reviewNote: String

  """UUID of the admin who decided"""
  reviewedBy: String

  """UUID of the user who made the suggestion"""
  createdBy: String
  createdAt: DateTime
  updatedAt: DateTime
}

type StationType {
  uuid: UUID!

  """Internal polymorphic discriminator — always 'station'"""
  propertyName: String!

  """
  GeoJSON geometry — Point for a station location, Polygon/MultiPolygon for an area
  """
  geometry: GeoJSON

  """UUID of the user who created this station"""
  createdBy: String

  """Station category, e.g. 'shelter', 'supply', 'medical'"""
  type: String
  name: String
  description: String

  """Operating hours in free-text format, e.g. '09:00–18:00' or '24h'"""
  opHour: String

  """Importance level used for map rendering priority (0 = default)"""
  level: Int!

  """Internal admin comment, not shown to the public"""
  comment: String

  """Data source of this record: 'user' or 'official'"""
  source: String

  """Who can see this station: 'public' or 'restricted'"""
  visibility: String

  """Review state: 'unverified', 'ai_verified', or 'human_verified'"""
  verificationStatus: String

  """True if this station has been flagged as a duplicate entry"""
  isDuplicate: Boolean!

  """True if this is a temporary station (e.g. emergency shelter)"""
  isTemporary: Boolean!

  """True if this station is operated by a government or official body"""
  isOfficial: Boolean!

  """
  Whether the station is open: 'active', 'temporarily_closed', or 'permanently_closed'
  """
  operationalStatus: String!

  """When operational_status last changed"""
  statusChangedAt: DateTime
  createdAt: DateTime
  updatedAt: DateTime

  """
  Station contact name — masked unless the caller holds station.view_pii here
  """
  contactName: String

  """
  Station contact email — masked unless the caller holds station.view_pii here
  """
  contactEmail: String

  """
  Station contact phone — masked unless the caller holds station.view_pii here
  """
  contactPhone: String
  photos: [PhotoType!]!
  secondaryLocation: SecondaryLocationType
  properties: [StationPropertyType!]!
}


  createdAt: DateTime
  updatedAt: DateTime
}

type AssignedTeamType {
  uuid: UUID!
  name: String!
  type: String!
}

input BoundsInput {
  """South boundary latitude"""
  minLat: Float!

  """North boundary latitude"""
  maxLat: Float!

  """West boundary longitude"""
  minLng: Float!

  """East boundary longitude"""
  maxLng: Float!
}

enum BriefingState {
  BRIEFING
  IN_FIELD
  DEBRIEF
}

type BriefingTemplateType {
  uuid: UUID!
  content: String!

  """Free-form categorization tags"""
  tags: [String!]!

  """Lifecycle phase: 'briefing', 'in_field', or 'debrief'"""
  state: String!

  """UUID of the user who created this template"""

# 申請成為後台人員 (Backend Spec/019). One query answers both which entry the site shows —
# 前往後台 or 申請成為後台人員 — and what the application drawer lists. Read live, not from the
# session: approving an application adds an identity while the session lives on.
query MyRoleRequests {
  myRoleRequests {
    hasBackofficeIdentity
    canApply
    requests {
      uuid
      requestedRole
      status
      reviewNote
      createdAt
      closedAt
    }
  }
}

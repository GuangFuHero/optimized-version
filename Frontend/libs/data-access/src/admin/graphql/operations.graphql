mutation AdminUnassignTaskActor($uuid: UUID!) {
  unassignTaskActor(uuid: $uuid)
}
mutation AdminCreateStation(
  $input: CreateStationInput!
  $acknowledgedDuplicateOf: String
) {
  createStation(
    input: $input
    acknowledgedDuplicateOf: $acknowledgedDuplicateOf
  ) {
    __typename
    ... on StationCreated {
      station {
        ...AdminStationFields
      }
    }
    ... on DuplicatesSuspected {
      suspects {
        relatedKind
        relatedUuid
      }
    }
  }
}
mutation AdminUpdateStation($uuid: UUID!, $input: UpdateStationInput!) {
  updateStation(uuid: $uuid, input: $input) {
    ...AdminStationFields
  }
}
mutation AdminDeleteStation($uuid: UUID!) {
  deleteStation(uuid: $uuid)
}
mutation AdminMergeStationSuggestions(
  $stationUuid: UUID!
  $decisions: [SuggestionDecisionInput!]!
  $reviewNote: String
) {
  mergeStationSuggestions(
    stationUuid: $stationUuid
    decisions: $decisions
    reviewNote: $reviewNote
  ) {
    uuid
    status
    changes {
      targetType
      targetUuid
      fieldName
      before
      after
    }
  }
}

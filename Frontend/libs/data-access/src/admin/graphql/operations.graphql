fragment AdminPageInfo on PageInfo {
  totalCount
  hasNextPage
  hasPreviousPage
}
fragment AdminTicketFields on TicketType {
  uuid
  title
  description
  geometry
  status
  priority
  taskType
  auditStatus
  contactName
  contactEmail
  contactPhone
  createdBy
  createdAt
  updatedAt
}
fragment AdminTaskFields on TicketTaskType {
  uuid
  ticketUuid
  taskType
  taskName
  taskDescription
  quantity
  status
  progressNote
  source
  createdAt
  updatedAt
  assignments {
    uuid
    actorUuid
    role
    status
    assignedAt
    updatedAt
  }
}
fragment AdminStationFields on StationType {
  uuid
  type
  name
  description
  geometry
  opHour
  level
  comment
  source
  visibility
  verificationStatus
  operationalStatus
  statusChangedAt
  supplyStatus
  pendingSuggestedFields
  isDuplicate
  isTemporary
  isOfficial
  createdBy
  createdAt
  updatedAt
  viewerCanEdit
  viewerCanDelete
  viewerCanViewHistory
  viewerCanViewPii
  viewerCanExport
  secondaryLocation {
    county
    town
  }
  assignedTeam {
    uuid
    name
    type
  }
}
query AdminTickets(
  $bounds: BoundsInput
  $status: String
  $priority: String
  $q: String
  $skip: Int = 0
  $limit: Int = 50
) {
  tickets(
    bounds: $bounds
    status: $status
    priority: $priority
    q: $q
    skip: $skip
    limit: $limit
  ) {
    items {
      ...AdminTicketFields
      tasks {
        ...AdminTaskFields
      }
    }
    pageInfo {
      ...AdminPageInfo
    }
  }
}
query AdminTicket($uuid: UUID!) {
  ticket(uuid: $uuid) {
    ...AdminTicketFields
    secondaryLocation {
      fullAddress
      county
      town
      village
      neighborhood
      road
      section
      lane
      alley
      no
      normalizationStatus
      floor
      room
      landmarkNote
    }
    photos {
      uuid
      url
      createdAt
    }
    tasks {
      ...AdminTaskFields
      properties {
        uuid
        propertyName
        propertyValue
        quantity
        status
        comment
      }
    }
    disasterDetails {
      uuid
      propertyName
      value
    }
  }
}
query AdminTicketTasks(
  $ticketUuid: String!
  $status: String
  $q: String
  $skip: Int = 0
  $limit: Int = 50
) {
  ticketTasks(
    ticketUuid: $ticketUuid
    status: $status
    q: $q
    skip: $skip
    limit: $limit
  ) {
    ...AdminTaskFields
  }
}
query AdminStations(
  $bounds: BoundsInput
  $stationType: String
  $operationalStatus: StationOperationalStatus
  $q: String
  $assignedTeamUuid: UUID
  $unassignedOnly: Boolean = false
  $hasPendingSuggestions: Boolean = false
  $reviewableOnly: Boolean = false
  $skip: Int = 0
  $limit: Int = 50
) {
  stations(
    bounds: $bounds
    stationType: $stationType
    operationalStatus: $operationalStatus
    q: $q
    assignedTeamUuid: $assignedTeamUuid
    unassignedOnly: $unassignedOnly
    hasPendingSuggestions: $hasPendingSuggestions
    reviewableOnly: $reviewableOnly
    skip: $skip
    limit: $limit
  ) {
    items {
      ...AdminStationFields
    }
    pageInfo {
      ...AdminPageInfo
    }
  }
}
query AdminAssignableStationTeams {
  assignableStationTeams {
    uuid
    name
    type
  }
}
query AdminStation($uuid: UUID!) {
  station(uuid: $uuid) {
    ...AdminStationFields
    contactName
    contactPhone
    contactEmail
    secondaryLocation {
      fullAddress
      county
      town
      village
      neighborhood
      road
      section
      lane
      alley
      no
      normalizationStatus
      floor
      room
      poleId
      poleType
      poleNote
    }
    photos {
      uuid
      url
      createdAt
    }
    properties {
      uuid
      propertyType
      propertyName
      quantity
      comment
      status
      weightings
      createdAt
    }
  }
}
query AdminReverseGeocode($lat: Float!, $lng: Float!) {
  reverseGeocode(lat: $lat, lng: $lng) {
    status
    fullAddress
    floor
    room
    addressToken
  }
}
query AdminStationReview($uuid: UUID!) {
  station(uuid: $uuid) {
    ...AdminStationFields
    properties {
      uuid
      propertyName
      quantity
      comment
      pendingSuggestedFields
    }
    suggestedFields {
      targetType
      targetUuid
      fieldName
      proposedValues
      suggestionCount
      comments
      firstSuggestedAt
    }
  }
  suggestableFields(targetType: "station") {
    fieldName
    dataType
    enumOptions
  }
}
query AdminAnnouncements(
  $filter: AnnouncementFilter = ALL
  $placement: AnnouncementPlacement = admin_page
) {
  announcements(filter: $filter, placement: $placement) {
    uuid
    content
    active
    placement
    publishedAt
    publisher {
      uuid
      name
    }
    createdAt
    updatedAt
  }
}
fragment AdminBriefingFields on BriefingType {
  uuid
  templateUuid
  content
  tags
  state
  status
  publishedAt
  createdAt
  updatedAt
  creator {
    uuid
    name
  }
  updater {
    uuid
    name
  }
  publisher {
    uuid
    name
  }
}
query AdminBriefings(
  $state: BriefingState
  $tag: String
  $status: BriefingStatusFilter! = PUBLISHED
) {
  briefings(state: $state, tag: $tag, status: $status) {
    ...AdminBriefingFields
  }
}
query AdminBriefingTemplates($state: BriefingState, $tag: String) {
  briefingTemplates(state: $state, tag: $tag) {
    uuid
    content
    tags
    state
    createdAt
    updatedAt
  }
}
query AdminStationPropertyConfigs(
  $stationType: String!
  $includeInactive: Boolean = true
) {
  stationPropertyConfigs(
    stationType: $stationType
    includeInactive: $includeInactive
  ) {

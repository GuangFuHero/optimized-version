    }
  }
}
query AdminTicketsExtent(
  $status: String
  $priority: String
  $q: String
  $needType: String
  $auditStatus: AuditStatus
  $disasterType: String
) {
  ticketsExtent(
    status: $status
    priority: $priority
    q: $q
    needType: $needType
    auditStatus: $auditStatus
    disasterType: $disasterType
  ) {
    count
    minLat
    maxLat
    minLng
    maxLng
  }
}
query AdminTicket($uuid: UUID!) {
  ticket(uuid: $uuid) {
    ...AdminTicketFields
    responsibleTeams {
      uuid
      name
    }
    auditNote
    auditedAt
    auditContentHash
    changesSinceAudit {
      entity
      entityUuid
      field
      auditedValue
      currentValue
    }
    secondaryLocation {
      fullAddress
      county
      town
      village
      neighborhood
      road
      section
      lane
      alley
      no
      normalizationStatus
      floor
      room
      landmarkNote
      locationType
      buildingSection
      spaceDescription
      victimSpace
      accessStatus
      poleId
      poleType
      poleNote
    }
    photos {
      uuid
      url
      createdAt
    }
    tasks {
      ...AdminTaskFields
      # The drawer's 指派承接 and its × on each person: ticket.assign on this need, and on each place.
      viewerCanAssign
      assignments {
        uuid
        viewerCanUnassign
      }
      properties {
        uuid
        propertyName
        propertyValue
        quantity
        status
        comment
      }
    }
    disasterDetails {
      uuid
      propertyName
      value
    }
  }
}
query AdminTicketTasks(
  $ticketUuid: String!
  $status: String
  $q: String
  $skip: Int = 0
  $limit: Int = 50
) {
  ticketTasks(
    ticketUuid: $ticketUuid
    status: $status
    q: $q
    skip: $skip
    limit: $limit

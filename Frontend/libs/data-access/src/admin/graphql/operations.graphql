query AdminStationReview($uuid: UUID!) {
  station(uuid: $uuid) {
    ...AdminStationFields
    properties {
      uuid
      propertyName
      quantity
      comment
      pendingSuggestedFields
    }
    suggestedFields {
      targetType
      targetUuid
      fieldName
      proposedValues
      suggestionCount
      comments
      firstSuggestedAt
    }
  }
  suggestableFields(targetType: "station") {
    fieldName
    dataType
    enumOptions
  }
}

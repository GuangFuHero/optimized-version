  }
}
query AdminClosureAreas(
  $bounds: BoundsInput
  $skip: Int = 0
  $limit: Int = 50
) {
  closureAreas(bounds: $bounds, skip: $skip, limit: $limit) {
    items {
      uuid
      geometry
      status
      informationSource
      comment

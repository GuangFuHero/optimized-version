fragment AdminPageInfo on PageInfo {
  totalCount
  hasNextPage
  hasPreviousPage
}
fragment AdminTicketFields on TicketType {
  uuid
  title
  description
  geometry
  status
  priority
  taskType
  visibility
  verificationStatus
  contactName
  contactEmail
  contactPhone
  createdBy
  createdAt
  updatedAt
}
fragment AdminTaskFields on TicketTaskType {
  uuid
  ticketUuid
  taskType
  taskName
  taskDescription
  quantity
  status
  progressNote
  reviewNote
  source
  visibility
  moderationStatus
  createdAt
  updatedAt
  assignments {
    uuid
    actorUuid
    role
    status
    assignedAt
    updatedAt
  }
}
fragment AdminStationFields on StationType {
  uuid
  type
  name
  description
  geometry
  opHour
  level
  comment
  source
  visibility
  verificationStatus
  operationalStatus
  isDuplicate
  isTemporary
  isOfficial
  createdBy
  createdAt
  updatedAt
  assignedTeam {
    uuid
    name
    type
  }
}
query AdminTickets(
  $bounds: BoundsInput
  $status: String
  $priority: String
  $q: String
  $skip: Int = 0
  $limit: Int = 50
) {
  tickets(
    bounds: $bounds
    status: $status
    priority: $priority
    q: $q
    skip: $skip
    limit: $limit
  ) {
    items {
      ...AdminTicketFields
      tasks {
        ...AdminTaskFields
      }
    }
    pageInfo {
      ...AdminPageInfo
    }
  }
}
query AdminTicket($uuid: UUID!) {
  ticket(uuid: $uuid) {
    ...AdminTicketFields
    secondaryLocation {
      county
      city
      lane
      alley
      no
      floor
      room
      landmarkNote
    }
    photos {
      uuid
      url
      createdAt
    }
    tasks {
      ...AdminTaskFields
      properties {
        uuid
        propertyName
        propertyValue
        quantity
        status
        comment
      }
    }
    disasterDetails {
      uuid
      propertyName
      value
    }
  }
}
query AdminTicketTasks(
  $ticketUuid: String!
  $status: String
  $q: String
  $skip: Int = 0
  $limit: Int = 50
) {
  ticketTasks(
    ticketUuid: $ticketUuid
    status: $status
    q: $q
    skip: $skip
    limit: $limit
  ) {
    ...AdminTaskFields
  }
}
query AdminStations(
  $bounds: BoundsInput
  $stationType: String
  $operationalStatus: StationOperationalStatus
  $q: String
  $assignedTeamUuid: UUID
  $unassignedOnly: Boolean = false
  $skip: Int = 0
  $limit: Int = 50
) {
  stations(
    bounds: $bounds
    stationType: $stationType
    operationalStatus: $operationalStatus
    q: $q
    assignedTeamUuid: $assignedTeamUuid
    unassignedOnly: $unassignedOnly
    skip: $skip
    limit: $limit
  ) {
    items {
      ...AdminStationFields
    }
    pageInfo {
      ...AdminPageInfo
    }
  }
}
query AdminStation($uuid: UUID!) {
  station(uuid: $uuid) {
    ...AdminStationFields
    contactName
    contactPhone
    secondaryLocation {
      county
      city
      lane
      alley
      no
      floor
      room
      poleId
      poleType
      poleNote
    }
    photos {
      uuid
      url
      createdAt
    }
    properties {
      uuid
      propertyType
      propertyName
      quantity
      comment
      status
      weightings
      createdAt
    }
  }
}
query AdminAnnouncements($filter: AnnouncementFilter = ALL) {
  announcements(filter: $filter) {
    uuid
    content
    active
    order
    createdBy
    createdAt
    updatedAt
  }
}
query AdminBriefings($state: BriefingState, $tag: String) {

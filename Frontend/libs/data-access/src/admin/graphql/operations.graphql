fragment AdminPageInfo on PageInfo {
  totalCount
  hasNextPage
  hasPreviousPage
}
fragment AdminTicketFields on TicketType {
  uuid
  title
  description
  geometry
  status
  priority
  taskType
  auditStatus
  contactName
  contactEmail
  contactPhone
  createdBy
  createdAt
  updatedAt
  disasterTypes
  locationCell
  secondaryLocation {
    county
    town
  }
  viewerCanEdit
  viewerCanDelete
  viewerCanAudit
  viewerCanViewHistory
}
fragment AdminTaskFields on TicketTaskType {
  uuid
  ticketUuid
  taskType
  taskName
  taskDescription
  quantity
  status
  progressNote
  source
  createdAt
  updatedAt
  assignedCount
  recruitingStoppedAt
  assignments {
    uuid
    actorUuid
    actorName
    role
    status
    assignedAt
    updatedAt
  }
}
fragment AdminStationFields on StationType {
  uuid
  type
  name
  description
  geometry
  opHour
  level
  comment
  source
  visibility
  verificationStatus
  operationalStatus
  statusChangedAt
  supplyStatus
  pendingSuggestedFields
  isDuplicate
  isTemporary
  isOfficial
  createdBy
  createdAt
  updatedAt
  viewerCanEdit
  viewerCanDelete
  viewerCanViewHistory
  viewerCanViewPii
  viewerCanExport
  secondaryLocation {
    county
    town
  }
  assignedTeam {
    uuid
    name
    type
  }
}
query AdminTickets(
  $bounds: BoundsInput
  $status: String
  $priority: String
  $q: String
  $needType: String
  $auditStatus: AuditStatus
  $disasterType: String
  $zoom: Float
  $skip: Int = 0
  $limit: Int = 50
) {
  tickets(
    bounds: $bounds
    status: $status
    priority: $priority
    q: $q
    needType: $needType
    auditStatus: $auditStatus
    disasterType: $disasterType
    zoom: $zoom
    skip: $skip
    limit: $limit
  ) {
    items {
      ...AdminTicketFields
      # The board's row: the street line under the title, the 照片 count and the 指派 Team cell.
      secondaryLocation {
        fullAddress
        landmarkNote
      }
      photos {
        uuid
      }
      responsibleTeams {
        uuid
        name
      }
      tasks {
        ...AdminTaskFields
      }
    }
    pageInfo {
      ...AdminPageInfo
    }
  }
}
query AdminTicketMapPins(
  $bounds: BoundsInput
  $status: String
  $priority: String
  $q: String
  $needType: String
  $auditStatus: AuditStatus
  $disasterType: String
  $zoom: Float
  $skip: Int = 0
  $limit: Int = 50
) {
  tickets(
    bounds: $bounds
    status: $status
    priority: $priority
    q: $q
    needType: $needType
    auditStatus: $auditStatus
    disasterType: $disasterType
    zoom: $zoom
    skip: $skip
    limit: $limit
  ) {
    items {
      uuid
      title
      geometry
      status
      priority
      locationCell
      secondaryLocation {
        county
        town
        fullAddress
        landmarkNote
      }
    }
    pageInfo {

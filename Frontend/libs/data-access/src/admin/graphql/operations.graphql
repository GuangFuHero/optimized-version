mutation AdminCreateTicket($input: CreateTicketInput!) {
  createTicket(input: $input) {
    __typename
    ... on TicketCreated {
      ticket {
        ...AdminTicketFields
      }
    }
    ... on DuplicatesSuspected {
      suspects {
        draftRef
        relatedKind
        relatedUuid
        relatedTicketUuid
      }
    }
  }
}
mutation AdminUpdateTicket($uuid: UUID!, $input: UpdateTicketInput!) {
  updateTicket(uuid: $uuid, input: $input) {
    ...AdminTicketFields
  }
}

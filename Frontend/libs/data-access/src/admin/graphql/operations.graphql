    propertyName
    dataType
    enumOptions
    unit
    label
    displayLabel
    sortOrder
    isActive
  }
}
query AdminTaskPropertyConfigs(
  $taskType: String!
  $includeInactive: Boolean = true
) {
  taskPropertyConfigs(taskType: $taskType, includeInactive: $includeInactive) {
    uuid
    taskType
    propertyName
    dataType
    enumOptions
    unit
    disasterTypes
    label
    displayLabel
    sortOrder
    isActive
  }
}
query AdminTicketPropertyConfigs(
  $disasterTypes: [String!]!
  $includeInactive: Boolean = true
) {
  ticketPropertyConfigs(
    disasterTypes: $disasterTypes
    includeInactive: $includeInactive
  ) {
    uuid
    propertyName
    dataType
    enumOptions
    unit
    disasterTypes
    label
    displayLabel
    hint
    isActive
  }
}
query AdminDisasterTypes($includeInactive: Boolean = true) {
  disasterTypes(includeInactive: $includeInactive) {
    uuid
    key
    label
    isActive
  }
}
query AdminCurrentDisaster {
  currentDisaster {
    name
    shortName
  }
}
mutation AdminCreateTicket($input: CreateTicketInput!) {
  createTicket(input: $input) {
    __typename
    ... on TicketCreated {
      ticket {
        ...AdminTicketFields
      }
    }
  }
}
mutation AdminUpdateTicket($uuid: UUID!, $input: UpdateTicketInput!) {
  updateTicket(uuid: $uuid, input: $input) {
    ...AdminTicketFields
  }
}
mutation AdminDeleteTicket($uuid: UUID!) {
  deleteTicket(uuid: $uuid)
}
mutation AdminAuditTicket(
  $uuid: UUID!
  $status: AuditVerdict!
  $contentHash: String!
  $note: String
) {
  auditTicket(
    uuid: $uuid
    status: $status
    contentHash: $contentHash
    note: $note
  ) {
    ...AdminTicketFields
  }
}
mutation AdminSetTicketDisasterDetails(
  $uuid: UUID!
  $details: [TicketDisasterDetailInput!]!
) {
  setTicketDisasterDetails(uuid: $uuid, details: $details) {
    uuid
    propertyName

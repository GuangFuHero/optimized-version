query AdminWorkZones($skip: Int = 0, $limit: Int = 50) {
  workZones(skip: $skip, limit: $limit) {
    items {
      uuid
      name
      geometry
      createdAt
      updatedAt
      assignedTeams {
        uuid
        name
        type
      }
    }
    pageInfo {
      ...AdminPageInfo
